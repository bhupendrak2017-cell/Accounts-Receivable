            <label>Template</label>
            <select className="a-select" value={tplId} onChange={(e) => setTplId(e.target.value)}>
              {state.templates.filter((t) => t.channel === channel).map((t) => <option key={t.id} value={t.id}>{t.name} — {t.tone}</option>)}
            </select>
          </div>
          {channel === "email" && <div className="a-field"><label>Subject</label><input className="a-input" value={subject} onChange={(e) => setSubject(e.target.value)} /></div>}
          <div className="a-field">
            <label>Message</label>
            <textarea className="a-textarea" style={{ minHeight: 190, opacity: busy ? .5 : 1 }} value={body} onChange={(e) => setBody(e.target.value)} />
          </div>
          {channel === "email" && (
            <div className="a-field">
              <label>Attachments</label>
              <div className="a-chip-row">
                <Chip on={attach.invoice} onClick={() => setAttach({ ...attach, invoice: !attach.invoice })}><FileText size={12} />Invoice PDF</Chip>
                <Chip on={attach.statement} onClick={() => setAttach({ ...attach, statement: !attach.statement })}><Receipt size={12} />Account statement</Chip>
                <Chip on={attach.portal} onClick={() => setAttach({ ...attach, portal: !attach.portal })}><Landmark size={12} />Payment portal link</Chip>
              </div>
            </div>
          )}
        </div>

        <div style={{ display: "grid", gap: 12, alignContent: "start" }}>
          <AIPanel title="Why this message">
            <div style={{ fontSize: 12.8, lineHeight: 1.6 }}>{nba?.rationale}</div>
            <div style={{ marginTop: 10 }}><Confidence value={nba?.confidence || 0.7} /></div>
          </AIPanel>
          <Card title="Writing tools">
            <div className="a-btn-row">
              <button className="a-btn sm" onClick={() => aiTool("shorten")}>Shorten</button>
              <button className="a-btn sm" onClick={() => aiTool("firmer")}>Make firmer</button>
              <button className="a-btn sm" onClick={() => aiTool("warmer")}>Relationship-sensitive</button>
              <button className="a-btn sm" onClick={() => aiTool("summary")}>Summarise account</button>
              <button className="a-btn sm" onClick={() => aiTool("invoices")}>Add open invoices</button>
              <button className="a-btn sm" onClick={() => aiTool("options")}>Add payment options</button>
              <button className="a-btn sm" onClick={() => aiTool("translate")}>Translate to English</button>
            </div>
          </Card>
          {channel === "whatsapp" && (
            <div className="a-note">WhatsApp uses the approved utility template {state.templates.find((t) => t.id === tplId)?.meta?.templateId || "—"}. Opt-in is on record for this contact and every message carries an opt-out line.</div>
          )}
          <Card title="Account at a glance">
            <KV items={[["Outstanding", compact(c.outstanding)], ["Overdue", compact(c.overdue)], ["Oldest", c.oldest ? `${c.oldest} days` : "—"], ["Promise", c.activePtp ? fmtDate(c.activePtp.promiseDate) : c.brokenPtp.length ? `${c.brokenPtp.length} broken` : "None"], ["Dispute", c.disputed ? compact(c.disputed) : "None"]]} />
          </Card>
        </div>
      </div>
    </Modal>
  );
}

  const scrollRef = useRef(null);

  const script = useMemo(() => {
    const inv = c.invoices[0];
    return [
      { who: "agent", t: `Good morning, this is the accounts receivable assistant calling on behalf of Northstar Industrial Systems. Am I speaking with ${contact?.name}?` },
      { who: "cust", t: "Yes, speaking." },
      { who: "agent", t: `Thank you. I am calling about ${money(c.overdue)} that is overdue on your account${inv ? `, the oldest being ${inv.id} for ${money(inv.balance, inv.currency)}, due ${fmtDate(inv.dueDate)}` : ""}.` },
      { who: "cust", t: c.brokenPtp.length ? "I know. The last run was deferred again — our treasury has been consolidating accounts." : "Let me check where that is in our cycle." },
      { who: "agent", t: c.brokenPtp.length ? "I understand. Two dates have already passed without payment, so I need a date we can rely on this time." : "Of course. Is there anything at our end holding it up — a missing document or a purchase order reference?" },
      { who: "cust", t: `We can release it on ${fmtDate(addDays(state.today, 7))}. I will push it through myself.` },
      { who: "agent", t: `Noted — ${money(c.invoices[0]?.balance || 0)} on ${fmtDate(addDays(state.today, 7))}. I will record that commitment and pause reminders until then. I am not able to agree any change to the amount or the terms on this call; if you need that, our AR manager will come back to you.` },
      { who: "cust", t: "Understood, that is fine." },
      { who: "agent", t: "Thank you for your time. You will receive a written confirmation shortly." },
    ];
  }, [c, contact, state.today]);

  useEffect(() => {
    if (phase !== "live") return;
    let i = 0;
    const t = setInterval(() => {
      setLines((l) => [...l, script[i]]);
      i++;
      if (i >= script.length) { clearInterval(t); setTimeout(() => setPhase("outcome"), 700); }
    }, 900);
    return () => clearInterval(t);
  }, [phase, script]);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [lines]);

  return (
    <Modal open onClose={onClose} size="lg" title={`AI collection call — ${c.name}`} subtitle={phase === "brief" ? "Review the brief before the call is placed" : phase === "live" ? "Live transcript" : "Structured outcome"}
      footer={phase === "brief" ? <>
        <button className="a-btn pri" onClick={() => { setLines([]); setPhase("live"); }}><Phone size={14} />Place the call</button>
        <button className="a-btn" onClick={onClose}>Cancel</button>
        <span style={{ marginLeft: "auto", alignSelf: "center" }}><Badge kind="pos" icon={ShieldCheck}>Calls permitted {state.policies.communication.callHours} to authorised contacts</Badge></span>
      </> : phase === "outcome" ? <>
        <button className="a-btn pri" onClick={() => {
          dispatch({ type: "CALL_COMPLETE", payload: { customerId, contactId, transcript: lines, sentiment: "Cooperative, committed to a date", durationSec: 186, outcome: `Commitment of ${money(outcome.amount)} for ${fmtDate(outcome.promise_date)}`, extraction: { ...outcome, currency: "USD", invoice_ids: c.invoices.slice(0, 1).map((i) => i.id) } } });
          onClose();
        }}><Check size={14} />Confirm and create the promise</button>
        <button className="a-btn" onClick={onClose}>Discard</button>
      </> : null}>
      {phase === "brief" && (
        <div className="a-grid" style={{ gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <Card title="Who we are calling">
            <div className="a-field">
              <label>Contact</label>
              <select className="a-select" value={contactId} onChange={(e) => setContactId(e.target.value)}>
                {c.contacts.map((x) => <option key={x.id} value={x.id}>{x.name} — {x.role}</option>)}
              </select>
            </div>
            <KV items={[["Phone", contact?.phone], ["Language", contact?.language], ["Behaviour", contact?.responsiveness], ["Last contacted", relDays(contact?.lastContacted)]]} />
          </Card>
          <Card title="Objective">
            <div style={{ fontSize: 13, lineHeight: 1.6 }}>
              Secure a dated commitment for {money(c.overdue)}{c.brokenPtp.length ? `, given ${c.brokenPtp.length} previous commitments were not honoured` : ""}. Confirm whether anything at the customer's end is blocking payment.
            </div>
          </Card>
          <Card title="Outstanding invoices" pad={false}>
            <DataTable pageSize={5} rows={c.invoices} columns={[
              { k: "i", h: "Invoice", render: (r) => r.id }, { k: "b", h: "Balance", num: true, render: (r) => money(r.balance, r.currency) },
              { k: "d", h: "Due", render: (r) => fmtDate(r.dueDate) }, { k: "o", h: "Overdue", num: true, render: (r) => r.daysOverdue ? <Neg>{r.daysOverdue}d</Neg> : "—" },
            ]} />
          </Card>
          <Card title="Context and boundaries">
            <KV items={[
              ["Previous promises", c.brokenPtp.length ? `${c.brokenPtp.length} broken (${c.brokenPtp.map((p) => fmtDate(p.promiseDate)).join(", ")})` : "None broken"],
              ["Known disputes", c.disputes.length ? c.disputes.map((x) => `${x.id} — ${money(x.amount)} ${x.reason}`).join("; ") : "None"],
              ["Payment history", c.intel.behaviour],
            ]} />
            <div className="a-note neg" style={{ marginTop: 10 }}>Negotiation boundaries: the agent may record a payment date and answer factual questions. It may not agree a discount, a settlement, a credit or a payment plan. Anything of that kind is routed to a person.</div>
          </Card>
        </div>
      )}
      {phase === "live" && (
        <div>
          <div className="a-transcript" ref={scrollRef} style={{ maxHeight: 340 }}>
            {lines.map((l, i) => <div key={i} className={`a-tr-line ${l.who === "cust" ? "cust" : ""}`}><span className="who">{l.who === "cust" ? contact?.name?.split(" ")[0] || "Customer" : "Agent"}</span>{l.t}</div>)}
            {lines.length < script.length && <div className="a-tr-line" style={{ opacity: .6 }}><span className="who">…</span>listening</div>}
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 12, alignItems: "center" }}>
            <Badge kind="pos"><span className="a-dot pos" />Connected</Badge>
            <span className="a-muted" style={{ fontSize: 12 }}>Simulated call for this prototype. In production the transcript would be produced by the telephony provider.</span>
          </div>
        </div>
      )}
      {phase === "outcome" && (
        <div className="a-grid" style={{ gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <Card title="Extracted outcome">
            <div className="a-field"><label>Customer intent</label>
              <select className="a-select" value={outcome.intent} onChange={(e) => setOutcome({ ...outcome, intent: e.target.value })}>
                <option value="promise_to_pay">Promise to pay</option><option value="dispute">Dispute raised</option><option value="question">Question</option><option value="other">Other</option>
              </select></div>
            <div className="a-field"><label>Amount</label><input className="a-input" type="number" value={outcome.amount} onChange={(e) => setOutcome({ ...outcome, amount: +e.target.value })} /></div>
            <div className="a-field"><label>Promised date</label><input className="a-input" type="date" value={outcome.promise_date} onChange={(e) => setOutcome({ ...outcome, promise_date: e.target.value })} /></div>
            <Confidence value={outcome.confidence} label="Extraction confidence" />
          </Card>
          <Card title="Structured notes">
            <KV items={[["Sentiment", "Cooperative, committed to a date"], ["Duration", "3m 06s"], ["Follow-up", `Confirmation email, then monitor the bank feed on ${fmtDate(outcome.promise_date)}`], ["Concessions agreed", "None — outside the agent's authority"]]} />
            <div className="a-note" style={{ marginTop: 10 }}>Confirming here creates the promise, pauses reminders on the referenced invoice, moves the forecast and updates the predicted payment date.</div>
          </Card>
        </div>
      )}
    </Modal>
  );
}

/* ------------------------------ invoice drawer --------------------------- */
function InvoiceDrawer({ id, onClose }) {
  const { state, d, nav, compose } = useApp();
  const inv = d.invById[id];
  if (!inv) return null;
  const c = d.custView[inv.customerId];
  const pred = d.predictions[id];
  const disputes = state.disputes.filter((x) => x.invoiceId === id);
  const allocs = state.allocations.filter((a) => a.invoiceId === id);
  return (
    <Drawer open onClose={onClose} title={`${inv.id} — ${money(inv.amount, inv.currency)}`} subtitle={`${c.name} · ${inv.desc}`}
      badges={<><Badge kind={inv.status === "paid" ? "pos" : inv.daysOverdue > 0 ? "neg" : "mute"}>{inv.status === "paid" ? "Paid" : inv.daysOverdue > 0 ? `${inv.daysOverdue} days overdue` : "Current"}</Badge><Badge kind="mute">{inv.entity}</Badge><Badge kind="mute">PO {inv.po}</Badge></>}
      footer={<>
        <button className="a-btn pri" onClick={() => { compose({ customerId: c.id, channel: "email", invoiceIds: [id] }); onClose(); }}><Send size={14} />Send a reminder</button>
        <button className="a-btn" onClick={() => { nav({ screen: "customer", id: c.id }); onClose(); }}>Open customer 360</button>
      </>}>
      <div style={{ display: "grid", gap: 14 }}>
        <div className="a-grid" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(130px,1fr))" }}>
          <Stat label="Balance" value={money(inv.balance, inv.currency)} />
          <Stat label="Collectible" value={money(inv.collectible, inv.currency)} kind="pos" />
          <Stat label="Disputed" value={money(inv.disputed, inv.currency)} kind={inv.disputed ? "neg" : "pos"} />
        </div>
        <KV items={[
          ["Issued", fmtDate(inv.issueDate)], ["Due", `${fmtDate(inv.dueDate)} (Net ${c.terms})`],
          ["Aging bucket", inv.bucket], ["ERP document", inv.erpDoc], ["Currency", inv.currency],
          ["Paid to date", money(inv.paidAmount, inv.currency)],
        ]} />
        {inv.lines && (
          <div>
            <div className="a-label" style={{ marginBottom: 6 }}>Invoice lines</div>
            <table className="a-table"><tbody>{inv.lines.map((l, i) => (
              <tr key={i}><td>{l.d}</td><td className="num strong">{money(l.a, inv.currency)}</td><td>{disputes.some((x) => Math.abs(x.amount - l.a) < 1) ? <Badge kind="neg">Disputed</Badge> : ""}</td></tr>
            ))}</tbody></table>
          </div>
        )}
        {pred && (
          <AIPanel title="Predicted payment" icon={CalendarDays}>
            <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap", marginBottom: 10 }}>
              <div style={{ fontSize: 18, fontWeight: 650 }}>{fmtDate(pred.date)}</div>
              <Badge kind={PRED_KIND[pred.status]}>{pred.status}</Badge>
              <div style={{ width: 180 }}><Confidence value={pred.confidence} /></div>
            </div>
            <div className="a-label" style={{ marginBottom: 6 }}>Key drivers</div>
            <div style={{ display: "grid", gap: 6 }}>
              {pred.drivers.map((x, i) => (
                <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", fontSize: 12.5 }}>
                  <span className={`a-dot ${x.k === "neg" ? "neg" : x.k === "pos" ? "pos" : ""}`} style={{ marginTop: 6 }} />{x.t}
                </div>
              ))}
            </div>
          </AIPanel>
        )}
        {!!disputes.length && (
          <div>
            <div className="a-label" style={{ marginBottom: 6 }}>Disputes</div>
            {disputes.map((x) => <div key={x.id} className="a-note neg">{x.id} — {money(x.amount)} {titleCase(x.reason).toLowerCase()}. {x.status === "resolved" ? `Resolved: ${x.resolution}.` : "Collection paused on this amount; the rest of the invoice continues."}</div>)}
          </div>
        )}
        {!!allocs.length && (
          <div>
            <div className="a-label" style={{ marginBottom: 6 }}>Cash applied</div>
            <table className="a-table"><thead><tr><th>Payment</th><th>Type</th><th className="num">Amount</th></tr></thead>
              <tbody>{allocs.map((a) => <tr key={a.id}><td>{a.paymentId}</td><td>{titleCase(a.type)}{a.ref ? ` ${a.ref}` : ""}</td><td className="num">{money(a.amount, inv.currency)}</td></tr>)}</tbody></table>
          </div>
        )}
      </div>
    </Drawer>
  );
}

/* -------------------------------- portal --------------------------------- */
function PortalView({ customerId, onExit }) {
  const { state, dispatch, d } = useApp();
  const [cid, setCid] = useState(customerId || "c_zenith");
  const c = d.custView[cid];
  const [sel, setSel] = useState([]);
  const [tab, setTab] = useState("open");
  const [planReq, setPlanReq] = useState(null);
  const [dispute, setDispute] = useState(null);
  const [receipt, setReceipt] = useState(null);
  const [statement, setStatement] = useState(false);
  const selTotal = sum(c.invoices.filter((i) => sel.includes(i.id)), (i) => i.collectible);
  const paid = c.allInvoices.filter((i) => i.status === "paid");
  const pays = state.payments.filter((p) => p.customerId === cid);

  const track = (type, detail) => dispatch({ type: "PORTAL_EVENT", payload: { customerId: cid, type, detail }, suppressReminder: type === "payment.started" });

  useEffect(() => { setSel([]); }, [cid]);

  return (
    <div className="a-portal">
      <div className="a-portal-top">
        <div className="a-brand-mark" style={{ background: "#fff", color: "#0A2342" }}>A</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 650 }}>{ORG.name}</div>
          <div style={{ fontSize: 11.5, opacity: .8 }}>Customer payment portal · secure link for {c.name}</div>
        </div>
        <select className="a-select" style={{ width: 220, background: "rgba(255,255,255,.1)", color: "#fff", border: "1px solid rgba(255,255,255,.25)" }} value={cid} onChange={(e) => setCid(e.target.value)}>
          {d.customers.filter((x) => x.outstanding > 0).map((x) => <option key={x.id} value={x.id} style={{ color: "#12233B" }}>{x.name}</option>)}
        </select>
        <button className="a-btn" style={{ background: "#fff", color: "var(--navy)", borderColor: "#fff", fontWeight: 600 }} onClick={onExit}><LogOut size={14} />Back to {PRODUCT.name}</button>
      </div>

      <div className="a-portal-wrap">
        <div className="a-grid" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(190px,1fr))", marginBottom: 16 }}>
          <Stat label="Total outstanding" value={money(c.outstanding)} />
          <Stat label="Past due" value={money(c.overdue)} kind={c.overdue ? "neg" : "pos"} sub={c.oldest ? `Oldest ${c.oldest} days` : "Nothing past due"} />
          <Stat label="Not yet due" value={money(c.current)} kind="pos" />
          {c.plan && <Stat label={`Payment plan ${c.plan.id}`} value={`${c.plan.installments.filter((i) => i.status === "paid").length} of ${c.plan.installmentCount} paid`} sub={`Next ${fmtDate((c.plan.installments.find((i) => i.status !== "paid") || {}).dueDate)}`} />}
        </div>

        {c.plan && c.plan.installments.some((i) => i.status === "missed" || (i.status === "due" && i.dueDate < state.today)) && (
          <div className="a-note neg" style={{ marginBottom: 14 }}>An instalment on your payment plan has not been received. Paying it now keeps the remaining schedule in place.</div>
        )}

        <Card pad={false} title="Your account"
          actions={<>
            <button className="a-btn sm" onClick={() => { track("statement.downloaded", "Statement downloaded from the portal"); setStatement(true); }}><Download size={13} />Download statement</button>
            <button className="a-btn sm" onClick={() => setPlanReq({ count: 4, start: addDays(state.today, 3), freq: "Fortnightly" })}><CalendarDays size={13} />Request a payment plan</button>
          </>}>
          <Tabs value={tab} onChange={setTab} tabs={[{ id: "open", label: "Open invoices", count: c.invoices.length }, { id: "paid", label: "Paid", count: paid.length }, { id: "payments", label: "Payment history", count: pays.length }, { id: "disputes", label: "Queries", count: state.disputes.filter((x) => x.customerId === cid).length }]} />
          <div style={{ padding: "0 16px 16px" }}>
            {tab === "open" && (
              <>
                <DataTable rows={c.invoices} selectable selected={sel} onSelect={setSel} pageSize={10}
                  columns={[
                    { k: "i", h: "Invoice", render: (r) => <span className="strong">{r.id}</span> },
                    { k: "d", h: "Description", wrap: true, render: (r) => r.desc },
                    { k: "is", h: "Issued", render: (r) => fmtDate(r.issueDate) },
                    { k: "du", h: "Due", render: (r) => <span style={{ color: r.daysOverdue > 0 ? "var(--neg)" : "inherit" }}>{fmtDate(r.dueDate)}</span> },
                    { k: "a", h: "Amount", num: true, render: (r) => money(r.amount, r.currency) },
                    { k: "b", h: "Payable now", num: true, render: (r) => <span className="strong">{money(r.collectible, r.currency)}</span> },
                    { k: "s", h: "Status", render: (r) => r.disputed ? <Badge kind="warn">Query under review</Badge> : r.daysOverdue > 0 ? <Badge kind="neg">Past due</Badge> : <Badge kind="pos">Open</Badge> },
                    { k: "ac", h: "", render: (r) => <span style={{ display: "flex", gap: 5 }}>
                      <button className="a-btn xs" onClick={(e) => { e.stopPropagation(); track("invoice.viewed", `${r.id} viewed`); }}><Eye size={11} />View</button>
                      <button className="a-btn xs" onClick={(e) => { e.stopPropagation(); track("invoice.downloaded", `${r.id} downloaded`); }}><Download size={11} /></button>
                      <button className="a-btn xs" onClick={(e) => { e.stopPropagation(); setDispute({ invoiceId: r.id, amount: r.collectible, reason: "freight", note: "" }); }}>Raise a query</button>
                    </span> },
                  ]} />
                <div style={{ display: "flex", gap: 12, alignItems: "center", marginTop: 14, flexWrap: "wrap" }}>
                  <div><div className="a-label">Selected</div><div style={{ fontSize: 18, fontWeight: 650 }}>{money(selTotal)}</div></div>
                  <div style={{ flex: 1 }} />
                  <button className="a-btn" disabled={!sel.length} onClick={() => { track("payment.started", `Part payment started for ${money(Math.round(selTotal / 2))}`); dispatch({ type: "PAYMENT_IN", payload: { customerId: cid, payerName: c.name, amount: Math.round(selTotal / 2), method: "Online banking", bank: "First National Bank", reference: `PORTAL PART ${sel.join(" ")}`, source: "portal" } }); setReceipt({ amount: Math.round(selTotal / 2), invoices: sel }); setSel([]); }}>Pay part now</button>
                  <button className="a-btn pri" disabled={!sel.length} onClick={() => {
                    track("payment.started", `Payment started for ${money(selTotal)}`);
                    dispatch({ type: "PAYMENT_IN", payload: { customerId: cid, payerName: c.name, amount: selTotal, method: c.intel.method?.includes("Card") ? "Card" : "Online banking", bank: "First National Bank", reference: `PORTAL ${sel.join(" ")}`, source: "portal" } });
                    track("payment.completed", `${money(selTotal)} paid for ${sel.join(", ")}`);
                    setReceipt({ amount: selTotal, invoices: sel }); setSel([]);
                  }}><CreditCard size={14} />Pay {sel.length ? money(selTotal) : "selected"}</button>
                </div>
                <div className="a-note" style={{ marginTop: 12 }}>
                  Payment options for your account, in the order you have used them: {c.intel.method || "bank transfer"}, online banking, Card and card. Amounts under review following a query are excluded from the payable figure.
                </div>
              </>
            )}
            {tab === "paid" && <DataTable rows={paid} pageSize={10} empty={<Empty icon={Receipt} title="Nothing settled yet">Paid invoices will appear here.</Empty>}
              columns={[{ k: "i", h: "Invoice", render: (r) => r.id }, { k: "a", h: "Amount", num: true, render: (r) => money(r.amount, r.currency) }, { k: "d", h: "Paid on", render: (r) => fmtDate(r.paidDate) }, { k: "r", h: "", render: () => <button className="a-btn xs"><Download size={11} />Receipt</button> }]} />}
            {tab === "payments" && <DataTable rows={sortBy(pays, (p) => p.receivedDate, -1)} pageSize={10} empty={<Empty icon={Banknote} title="No payments yet">Your payments will be listed here.</Empty>}
              columns={[{ k: "i", h: "Reference", render: (r) => r.id }, { k: "a", h: "Amount", num: true, render: (r) => money(r.amount, r.currency) }, { k: "d", h: "Date", render: (r) => fmtDate(r.receivedDate) }, { k: "m", h: "Method", render: (r) => r.method }, { k: "s", h: "Status", render: (r) => <Badge kind={r.erpPosted ? "pos" : "warn"}>{r.erpPosted ? "Applied to your account" : "Being processed"}</Badge> }]} />}
            {tab === "disputes" && <DataTable rows={state.disputes.filter((x) => x.customerId === cid)} pageSize={10} empty={<Empty icon={Scale} title="No open queries">Raise a query from an invoice if something does not look right.</Empty>}
              columns={[{ k: "i", h: "Reference", render: (r) => r.id }, { k: "inv", h: "Invoice", render: (r) => r.invoiceId }, { k: "a", h: "Amount", num: true, render: (r) => money(r.amount) }, { k: "r", h: "Reason", render: (r) => titleCase(r.reason) }, { k: "s", h: "Status", render: (r) => <Badge kind={r.status === "resolved" ? "pos" : "warn"}>{r.status === "resolved" ? "Closed" : "Under review"}</Badge> }]} />}
          </div>
        </Card>

        <div className="a-muted" style={{ fontSize: 11.5, marginTop: 16, textAlign: "center" }}>
          Secure link valid for 14 days · {c.name} · For help, reply to any message from our accounts receivable team.
        </div>
      </div>

      <Modal open={!!planReq} onClose={() => setPlanReq(null)} size="sm" title="Request a payment plan" subtitle={`${money(c.outstanding)} outstanding`}
        footer={<>
          <button className="a-btn pri" onClick={() => {
            dispatch({ type: "PLAN_REQUEST", payload: { customerId: cid, invoiceIds: c.invoices.map((i) => i.id), totalAmount: c.outstanding - c.disputed, installmentCount: planReq.count, startDate: planReq.start, frequency: planReq.freq, via: "portal" } });
            dispatch({ type: "PORTAL_EVENT", payload: { customerId: cid, type: "payment_plan_requested", detail: `${planReq.count} ${planReq.freq.toLowerCase()} instalments from ${fmtDate(planReq.start)}` } });
            setPlanReq(null);
          }}>Submit request</button>
          <button className="a-btn" onClick={() => setPlanReq(null)}>Cancel</button>
        </>}>
        {planReq && (
          <div>
            <div className="a-field"><label>Number of instalments</label><input className="a-input" type="number" min={2} max={8} value={planReq.count} onChange={(e) => setPlanReq({ ...planReq, count: +e.target.value })} /></div>
            <div className="a-field"><label>First instalment</label><input className="a-input" type="date" value={planReq.start} onChange={(e) => setPlanReq({ ...planReq, start: e.target.value })} /></div>
            <div className="a-field"><label>Frequency</label><select className="a-select" value={planReq.freq} onChange={(e) => setPlanReq({ ...planReq, freq: e.target.value })}><option>Weekly</option><option>Fortnightly</option><option>Monthly</option></select></div>
            <div className="a-note">Each instalment would be about {money((c.outstanding - c.disputed) / planReq.count)}. Requests are reviewed by our accounts receivable team, usually within two working days.</div>
          </div>
        )}
      </Modal>

      <Modal open={!!dispute} onClose={() => setDispute(null)} size="sm" title="Raise a query" subtitle={dispute ? `Invoice ${dispute.invoiceId}` : ""}
        footer={<>
          <button className="a-btn pri" onClick={() => {
            dispatch({ type: "EMAIL_IN", payload: { customerId: cid, contactId: c.contacts[0]?.id, channel: "portal", subject: `Query raised in payment portal — ${dispute.invoiceId}`, body: dispute.note || `We are withholding ${money(dispute.amount)} on this invoice pending a ${dispute.reason} query.`, classification: "dispute", extraction: { intent: "dispute", amount: +dispute.amount, currency: "USD", invoice_ids: [dispute.invoiceId], reason: dispute.reason, confidence: 0.9 }, invoiceIds: [dispute.invoiceId] } });
            dispatch({ type: "PORTAL_EVENT", payload: { customerId: cid, type: "dispute_started", detail: `${money(dispute.amount)} queried on ${dispute.invoiceId}` } });
            setDispute(null);
          }}>Submit query</button>
          <button className="a-btn" onClick={() => setDispute(null)}>Cancel</button>
        </>}>
        {dispute && (
          <div>
            <div className="a-field"><label>Amount in question</label><input className="a-input" type="number" value={dispute.amount} onChange={(e) => setDispute({ ...dispute, amount: e.target.value })} /></div>
            <div className="a-field"><label>Reason</label><select className="a-select" value={dispute.reason} onChange={(e) => setDispute({ ...dispute, reason: e.target.value })}>{DISPUTE_REASONS.map((r) => <option key={r} value={r}>{titleCase(r)}</option>)}</select></div>
            <div className="a-field"><label>Tell us what is wrong</label><textarea className="a-textarea" value={dispute.note} onChange={(e) => setDispute({ ...dispute, note: e.target.value })} placeholder="For example: freight was charged although our order was on delivered terms." /></div>
            <div className="a-field"><label>Supporting document</label><button className="a-btn"><Upload size={13} />Attach a file</button></div>
            <div className="a-note">Only the amount you query is put on hold. The rest of the invoice stays payable, and you will hear from us with a written answer.</div>
          </div>
        )}
      </Modal>

      <Modal open={!!receipt} onClose={() => setReceipt(null)} size="sm" title="Payment submitted" subtitle={receipt ? `${money(receipt.amount)} for ${receipt.invoices.join(", ")}` : ""}
        footer={<><button className="a-btn pri" onClick={() => setReceipt(null)}>Done</button><button className="a-btn"><Download size={13} />Download receipt</button></>}>
        <div className="a-note pos">Thank you. Your payment has been submitted and will show against your invoices once it settles. A receipt has been emailed to you.</div>
      </Modal>

      <Modal open={statement} onClose={() => setStatement(false)} title={`Account statement — ${c.name}`} subtitle={`As at ${fmtDate(state.today)}`}
        footer={<><button className="a-btn pri"><Download size={14} />Download PDF</button><button className="a-btn" onClick={() => setStatement(false)}>Close</button></>}>
        <DataTable rows={c.allInvoices} pageSize={12}
          columns={[
            { k: "i", h: "Invoice", render: (r) => r.id }, { k: "d", h: "Issued", render: (r) => fmtDate(r.issueDate) },
            { k: "du", h: "Due", render: (r) => fmtDate(r.dueDate) }, { k: "a", h: "Amount", num: true, render: (r) => money(r.amount, r.currency) },
            { k: "p", h: "Paid", num: true, render: (r) => money(r.paidAmount, r.currency) }, { k: "b", h: "Balance", num: true, render: (r) => <span className="strong">{money(r.balance, r.currency)}</span> },
          ]} />
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 20, marginTop: 12, fontSize: 14 }}>
          <span className="a-label">Total outstanding</span><strong>{money(c.outstanding)}</strong>
        </div>
      </Modal>
    </div>
  );
}

/* --------------------------------- shell --------------------------------- */
const NAV = [
  { id: "overview", label: "Overview", icon: LayoutDashboard },
  { id: "accounts", label: "Collections", icon: Users, children: [
    { id: "accounts", label: "Accounts" }, { id: "work_queue", label: "Work queue" },
    { id: "campaigns", label: "Campaigns" }, { id: "communications", label: "Communication" },
  ] },
  { id: "incoming_payments", label: "Cash", icon: Banknote, children: [
    { id: "incoming_payments", label: "Incoming payments" }, { id: "matching_exceptions", label: "Matching exceptions" },
    { id: "remittances", label: "Remittances" }, { id: "unapplied", label: "Unapplied cash" },
    { id: "payment_plans", label: "Payment plans" }, { id: "payment_activity", label: "Payment activity" },
  ] },
  { id: "disputes_open", label: "Disputes", icon: Scale, children: [
    { id: "disputes_open", label: "Open cases" }, { id: "disputes_resolution", label: "Resolution queue" },
  ] },
  { id: "customers", label: "Customers", icon: Building2 },
  { id: "forecast", label: "Insight", icon: TrendingUp, children: [
    { id: "forecast", label: "Forecast" }, { id: "analytics", label: "Analytics" }, { id: "ai_activity", label: "AI activity" },
  ] },
  { id: "policies", label: "Admin", icon: Settings, children: [
    { id: "policies", label: "Agent policies" }, { id: "integrations", label: "Integrations" },
    { id: "users", label: "Users" }, { id: "audit", label: "Audit log" }, { id: "settings", label: "Settings" },
  ] },
];

function GlobalSearch() {
  const { state, d, nav, openInvoice } = useApp();
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  const ql = q.trim().toLowerCase();
  const groups = useMemo(() => {
    if (ql.length < 2) return [];
    const has = (s) => (s || "").toLowerCase().includes(ql);
    const g = [];
    const cs = d.customers.filter((c) => has(c.name) || has(c.erpId));
    if (cs.length) g.push({ label: "Customers", items: cs.slice(0, 5).map((c) => ({ id: c.id, primary: c.name, secondary: `${c.erpId} · ${compact(c.outstanding)} outstanding`, go: () => nav({ screen: "customer", id: c.id }), icon: Building2 })) });
    const cts = state.contacts.filter((c) => has(c.name) || has(c.email));
    if (cts.length) g.push({ label: "Contacts", items: cts.slice(0, 4).map((c) => ({ id: c.id, primary: c.name, secondary: `${c.role} · ${d.custById[c.customerId]?.name}`, go: () => nav({ screen: "customer", id: c.customerId }), icon: User })) });
    const invs = d.invoices.filter((i) => has(i.id) || has(i.po) || has(d.custById[i.customerId]?.name));
    if (invs.length) g.push({ label: "Invoices", items: invs.slice(0, 5).map((i) => ({ id: i.id, primary: i.id, secondary: `${d.custById[i.customerId]?.name} · ${money(i.balance, i.currency)}`, go: () => openInvoice(i.id), icon: FileText })) });
    const pays = state.payments.filter((p) => has(p.id) || has(p.payerName) || has(p.reference));
    if (pays.length) g.push({ label: "Payments", items: pays.slice(0, 4).map((p) => ({ id: p.id, primary: p.id, secondary: `${p.payerName} · ${money(p.amount, p.currency)}`, go: () => nav({ screen: "incoming_payments" }), icon: Banknote })) });
    const proms = state.promises.filter((p) => has(p.id) || has(d.custById[p.customerId]?.name));
    if (proms.length) g.push({ label: "Promises", items: proms.slice(0, 4).map((p) => ({ id: p.id, primary: p.id, secondary: `${d.custById[p.customerId]?.name} · ${money(p.amount)} on ${fmtDate(p.promiseDate)}`, go: () => nav({ screen: "customer", id: p.customerId }), icon: Flag })) });
    const disp = state.disputes.filter((x) => has(x.id) || has(d.custById[x.customerId]?.name) || has(x.reason));
    if (disp.length) g.push({ label: "Disputes", items: disp.slice(0, 4).map((x) => ({ id: x.id, primary: x.id, secondary: `${d.custById[x.customerId]?.name} · ${money(x.amount)} ${titleCase(x.reason).toLowerCase()}`, go: () => nav({ screen: "disputes_open" }), icon: Scale })) });
    const comms = state.communications.filter((m) => has(m.subject) || has(m.body));
    if (comms.length) g.push({ label: "Communications", items: comms.slice(0, 4).map((m) => ({ id: m.id, primary: m.subject || `${titleCase(m.channel)} message`, secondary: `${d.custById[m.customerId]?.name} · ${fmtDate(m.at.slice(0, 10))}`, go: () => nav({ screen: "communications" }), icon: Mail })) });
    const rems = state.remittances.filter((r) => has(r.id) || has(r.fileName));
    if (rems.length) g.push({ label: "Remittances", items: rems.slice(0, 3).map((r) => ({ id: r.id, primary: r.id, secondary: r.fileName, go: () => nav({ screen: "remittances" }), icon: Receipt })) });
    return g;
  }, [ql, state, d]);

  return (
    <div className="a-search" ref={ref}>
      <Search size={14} className="a-si" />
      <input value={q} onChange={(e) => { setQ(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} placeholder="Search customers, invoices, payments, promises, disputes…" />
      {open && ql.length >= 2 && (
        <div className="a-search-pop">
          {groups.length ? groups.map((g) => (
            <div key={g.label} className="a-sr-group">
              <div className="a-sr-label">{g.label}</div>
              {g.items.map((it) => (
                <button key={it.id} className="a-sr" onClick={() => { it.go(); setOpen(false); setQ(""); }}>
                  <it.icon size={14} className="a-muted" />
                  <span style={{ flex: 1 }}><span style={{ fontWeight: 600 }}>{it.primary}</span><span className="a-muted" style={{ marginLeft: 8, fontSize: 12 }}>{it.secondary}</span></span>
                  <ChevronRight size={13} className="a-muted" />
                </button>
              ))}
            </div>
          )) : <div style={{ padding: 16 }} className="a-muted">Nothing matches “{q}”. Try a customer name, an invoice number or a reference such as PTP or DSP.</div>}
        </div>
      )}
    </div>
  );
}

export default function PineloopAR() {
  const [state, dispatch] = useReducer(reducer, undefined, buildInitialState);
  const [route, setRoute] = useState({ screen: "overview" });
  const [history, setHistory] = useState([]);
  const [invList, setInvList] = useState(null);
  const [composeReq, setComposeReq] = useState(null);
  const [callFor, setCallFor] = useState(null);
  const [showNotif, setShowNotif] = useState(false);
  const [openGroup, setOpenGroup] = useState(null);
  const [askOpen, setAskOpen] = useState(false);
  const [showUser, setShowUser] = useState(false);
  const [portal, setPortal] = useState(null);
  const contentRef = useRef(null);

  const d = useMemo(() => derive(state), [state]);
  const user = state.users.find((u) => u.id === state.currentUserId);
  const can = (p) => (ROLE_PERMS[user?.role] || []).includes(p);

  const nav = (r) => {
    if (r.screen === "portal") { setPortal(r.id); return; }
    setHistory((h) => [...h.slice(-14), route]);
    setRoute(r);
    if (contentRef.current) contentRef.current.scrollTop = 0;
  };
  const back = () => {
    setHistory((h) => {
      if (!h.length) { setRoute({ screen: "overview" }); return h; }
      setRoute(h[h.length - 1]);
      return h.slice(0, -1);
    });
    if (contentRef.current) contentRef.current.scrollTop = 0;
  };

  useEffect(() => {
    if (!state.toasts.length) return;
    const t = setTimeout(() => dispatch({ type: "TOAST_DISMISS", id: state.toasts[0].id }), 6000);
    return () => clearTimeout(t);
  }, [state.toasts]);

  const ctx = { state, dispatch, d, route, nav, back, canGoBack: history.length > 0, can, openInvoice: (id) => nav({ screen: "invoice", id }), openInvoiceList: setInvList, compose: setComposeReq, startCall: setCallFor };

  const counts = {
    work_queue: d.tasks.filter((t) => t.status !== "completed").length,
    matching_exceptions: state.payments.filter((p) => p.matchState === "exception").length,
    disputes_open: d.openDisputes.length,
    unapplied: state.payments.filter((p) => p.matchState === "unapplied").length,
  };

  const screen = () => {
    switch (route.screen) {
      case "overview": return <OverviewScreen />;
      case "accounts": return <AccountsScreen />;
      case "work_queue": return <WorkQueueScreen />;
      case "campaigns": return <CampaignsScreen />;
      case "communications": return <CommunicationsScreen />;
      case "payment_activity": return <PaymentActivityScreen />;
      case "payment_plans": return <PaymentPlansScreen />;
      case "incoming_payments": return <IncomingPaymentsScreen />;
      case "matching_exceptions": return <MatchingExceptionsScreen />;
      case "remittances": return <RemittancesScreen />;
      case "unapplied": return <UnappliedCashScreen />;
      case "disputes_open": return <DisputesScreen mode="open" />;
      case "disputes_resolution": return <DisputesScreen mode="resolution" />;
      case "customers": return <CustomersScreen />;
      case "customer": return <Customer360 id={route.id} />;
      case "invoice": return <InvoiceJourney id={route.id} />;
      case "forecast": return <ForecastScreen />;
      case "ai_activity": return <AIActivityScreen />;
      case "analytics": return <AnalyticsScreen />;
      case "integrations": return <IntegrationsScreen />;
      case "policies": return <PoliciesScreen />;
      case "users": return <UsersScreen />;
      case "audit": return <AuditScreen />;
      case "settings": return <SettingsScreen />;
      default: return <OverviewScreen />;
    }
  };

  const listRows = invList ? (invList.ids ? invList.ids.map((id) => d.invById[id]).filter(Boolean) : d.invoices.filter((i) => i.status !== "paid").filter(invList.filter)) : [];

  return (
    <Ctx.Provider value={ctx}>
      <div className="pineloop">
        <style dangerouslySetInnerHTML={{ __html: CSS }} />
        {portal ? <PortalView customerId={portal} onExit={() => setPortal(null)} /> : (
          <div className="a-shell">
            <nav className="a-side">
              <div className="a-brand">
                <div className="a-brand-mark">A</div>
                <div>
                  <div className="a-brand-name">{PRODUCT.full}</div>
                  <div className="a-brand-sub">{PRODUCT.tagline}</div>
                </div>
              </div>
              <div className="a-nav">
                {NAV.map((g) => {
                  const kids = g.children || [];
                  const activeHere = route.screen === g.id || kids.some((k) => k.id === route.screen);
                  const open = kids.length ? (openGroup === null ? activeHere : openGroup === g.id) : false;
                  const groupCount = kids.reduce((n, k) => n + (counts[k.id] || 0), 0) + (counts[g.id] || 0);
                  return (
                    <div key={g.label} className="a-nav-group">
                      <button className={`${kids.length ? "a-nav-parent" : "a-nav-item"} ${activeHere ? (kids.length ? "is-open" : "is-active") : ""}`}
                        onClick={() => { if (kids.length) { if (open) setOpenGroup("none"); else { setOpenGroup(g.id); nav({ screen: g.id }); } } else { setOpenGroup("none"); nav({ screen: g.id }); } }}>
                        <g.icon size={15} style={{ flex: "none" }} />
                        <span className="lbl">{g.label}</span>
                        {!open && groupCount ? <span className={`a-count ${["disputes_open", "incoming_payments"].includes(g.id) ? "neg" : ""}`}>{groupCount}</span> : null}
                        {kids.length ? <ChevronRight size={13} className="chev" /> : null}
                      </button>
                      {open && (
                        <div className="a-nav-sub">
                          {kids.map((k) => (
                            <button key={k.id} className={`a-nav-item ${route.screen === k.id ? "is-active" : ""}`} onClick={() => { setOpenGroup(g.id); nav({ screen: k.id }); }}>
                              <span className="lbl">{k.label}</span>
                              {counts[k.id] ? <span className={`a-count ${["matching_exceptions", "disputes_open", "unapplied"].includes(k.id) ? "neg" : ""}`}>{counts[k.id]}</span> : null}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              <div className="a-side-foot">
                <button className="a-nav-item" onClick={() => setPortal("c_zenith")}><ExternalLink size={15} /><span className="lbl">Customer portal</span></button>
              </div>
            </nav>

            <main className="a-main">
              <header className="a-top">
                <GlobalSearch />
                <div className="a-top-actions">
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", lineHeight: 1.2, marginRight: 4 }}>
                    <span style={{ fontSize: 12.5, fontWeight: 650, color: "var(--ink)" }}>{ORG.name}</span>
                    <span className="a-muted" style={{ fontSize: 10.5 }}>{ORG.entities.length} entities · {ORG.baseCurrency} · as at {fmtDate(state.today)}</span>
                  </div>
                  <div style={{ position: "relative" }}>
                    <button className="a-btn ghost" onClick={() => setShowNotif((s) => !s)} aria-label="Notifications">
                      <Bell size={16} />{state.notifications.length ? <span style={{ position: "absolute", top: 2, right: 4, width: 7, height: 7, borderRadius: "50%", background: "var(--neg)" }} /> : null}
                    </button>
                    {showNotif && (
                      <div className="a-search-pop" style={{ left: "auto", right: 0, width: 340, top: 42 }}>
                        <div className="a-sr-label">Notifications</div>
                        {state.notifications.slice(0, 8).map((n) => (
                          <button key={n.id} className="a-sr" style={{ alignItems: "flex-start" }} onClick={() => { if (n.link) nav(n.link); setShowNotif(false); }}>
                            <span className={`a-dot ${n.kind}`} style={{ marginTop: 6 }} />
                            <span style={{ flex: 1 }}>
                              <span style={{ fontWeight: 600, display: "block", fontSize: 12.8 }}>{n.title}</span>
                              <span className="a-muted" style={{ fontSize: 12 }}>{n.body}</span>
                              <span className="a-muted" style={{ fontSize: 11, display: "block", marginTop: 2 }}>{fmtDateTime(n.at)}</span>
                            </span>
                          </button>
                        ))}
                        {!state.notifications.length && <div style={{ padding: 16 }} className="a-muted">Nothing new.</div>}
                      </div>
                    )}
                  </div>
                  <div style={{ position: "relative" }}>
                    <button className="a-btn ghost" style={{ display: "flex", alignItems: "center", gap: 8, height: 38, padding: "0 6px" }} onClick={() => setShowUser((v) => !v)} aria-label="Signed in as">
                      <Avatar name={user?.name} size={28} />
                      <span className="a-who"><span className="n">{user?.name}</span><span className="r">{user?.role}</span></span>
                      <ChevronDown size={13} className="a-muted" />
                    </button>
                    {showUser && (
                      <div className="a-search-pop" style={{ left: "auto", right: 0, width: 260, top: 44 }}>
                        <div className="a-sr-label">Switch profile</div>
                        {state.users.map((u) => (
                          <button key={u.id} className="a-sr" onClick={() => { dispatch({ type: "SET_USER", userId: u.id }); setShowUser(false); }}>
                            <Avatar name={u.name} size={22} />
                            <span style={{ flex: 1 }}><span style={{ fontWeight: 600, display: "block", fontSize: 12.6 }}>{u.name}</span><span className="a-muted" style={{ fontSize: 11.5 }}>{u.role}</span></span>
                            {u.id === state.currentUserId && <Check size={13} style={{ color: "var(--pos)" }} />}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </header>

              <div className="a-content" ref={contentRef}>{screen()}</div>
            </main>
          </div>
        )}

        {invList && (
          <Drawer open onClose={() => setInvList(null)} wide title={invList.title} subtitle={`${listRows.length} invoices · ${compact(sum(listRows, (i) => i.usdBalance))}`}>
            <DataTable rows={listRows} pageSize={14} onRow={(i) => { setInvList(null); nav({ screen: "invoice", id: i.id }); }}
              columns={[
                { k: "i", h: "Invoice", render: (r) => <span className="strong">{r.id}</span> },
                { k: "c", h: "Customer", sort: (r) => d.custById[r.customerId]?.name, render: (r) => d.custById[r.customerId]?.name },
                { k: "b", h: "Balance", num: true, sort: (r) => r.usdBalance, render: (r) => money(r.balance, r.currency) },
                { k: "d", h: "Due", sort: (r) => r.dueDate, render: (r) => fmtDate(r.dueDate) },
                { k: "o", h: "Overdue", num: true, sort: (r) => r.daysOverdue, render: (r) => r.daysOverdue ? <Neg>{r.daysOverdue}d</Neg> : <Pos>Current</Pos> },
                { k: "p", h: "Predicted", render: (r) => d.predictions[r.id] ? fmtDate(d.predictions[r.id].date) : "—" },
              ]} />
          </Drawer>
        )}
        {composeReq && <ComposeModal req={composeReq} onClose={() => setComposeReq(null)} />}
        {callFor && <CallModal customerId={callFor} onClose={() => setCallFor(null)} />}
        {!portal && <AskAI open={askOpen} onOpen={() => setAskOpen(true)} onClose={() => setAskOpen(false)} />}

        <div className="a-toasts">
          {state.toasts.map((t) => (
            <div key={t.id} className="a-toast">
              <Sparkles size={14} style={{ flex: "none", marginTop: 1 }} />
              <div><div className="t">{t.t}</div><div>{t.m}</div></div>
              <button className="a-btn xs ghost" style={{ color: "#fff", marginLeft: "auto" }} onClick={() => dispatch({ type: "TOAST_DISMISS", id: t.id })}><X size={12} /></button>
            </div>
          ))}
        </div>
      </div>
    </Ctx.Provider>
  );
}

const __rootEl = document.getElementById("root");
createRoot(__rootEl).render(<PineloopAR />);


const __boot = document.getElementById("__boot");
if (__boot) __boot.remove();
</script>

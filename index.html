/* ------------------------------- design system --------------------------- */
const CSS = `
.pineloop *, .pineloop *::before, .pineloop *::after { box-sizing: border-box; }
.pineloop {
  --navy: #0A2342; --navy-700: #123A63; --navy-500: #1F5C99; --navy-300: #6E93BC;

/* shell */
.a-shell { display: grid; grid-template-columns: 198px 1fr; height: 100vh; min-height: 620px; }
.a-side { background: var(--navy); color: #DCE6F2; display: flex; flex-direction: column; overflow: hidden; }

/* Ask AI */
.a-ask-btn { position: fixed; right: 18px; bottom: 18px; z-index: 75; display: flex; align-items: center; gap: 8px; padding: 10px 15px; border: 0; border-radius: 26px; background: linear-gradient(135deg,#1F5C99,#2E7BC4); color: #FFFFFF; font-size: 14px; font-weight: 700; letter-spacing: .01em; text-shadow: 0 1px 2px rgba(0,0,0,.18); box-shadow: 0 8px 22px rgba(10,35,66,.34); cursor: pointer; transition: transform .12s, box-shadow .12s; }

/* Invoice journey */
.a-rail { display: flex; align-items: stretch; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.a-rail-s { flex: 1; padding: 10px 12px; border-right: 1px solid var(--line-2); position: relative; min-width: 0; }
.a-rail-s:last-child { border-right: 0; }
.a-rail-s .n { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 650; }

.a-rail-s.bad { background: #FDF2F1; } .a-rail-s.bad .v { color: var(--neg); }
.a-jrow { display: grid; grid-template-columns: 108px 22px 1fr; gap: 10px; }
.a-jrow .when { font-size: 11.5px; color: var(--ink-3); padding-top: 10px; text-align: right; }

.a-jcard { border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; margin-bottom: 9px; background: #fff; }
.a-jcard.ai { border-left: 3px solid var(--navy-500); }

.a-jcard .t { font-size: 13px; font-weight: 620; }

.a-main { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

.a-search { position: relative; flex: 1; max-width: 460px; }

/* primitives */
.a-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }

.a-stat .d { font-size: 10.8px; margin-top: 3px; display: flex; align-items: center; gap: 4px; }

.a-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; font-weight: 550; color: var(--ink); white-space: nowrap; transition: background .12s, border-color .12s; }

function rngFrom(seed) {let s = seed >>> 0;return () => {s = (Math.imul(s, 1664525) + 1013904223) >>> 0;return s / 4294967296;};}
function buildHistory() {
  const invoices = [],payments = [],allocations = [];
  CUSTOMERS.forEach((c, ci) => {
    const r = rngFrom(9301 + ci * 137);
    const n = 8;
    for (let i = 0; i < n; i++) {
      const issue = addDays(ANCHOR, -(205 - i * 25) - Math.round(r() * 4));
      const due = addDays(issue, c.terms);
      const delay = Math.max(-4, Math.round(c.avgDelay + (r() * 10 - 5)));
      const paid = addDays(due, delay);
      if (dayDiff(ANCHOR, paid) < 0) continue;
      const base = c.tier === "Strategic" ? 260000 : c.tier === "Key account" ? 190000 : c.tier === "Long tail" ? 60000 : 120000;
      const raw = base * (0.55 + r() * 1.2) / (c.currency === "EUR" ? 1.085 : 1);
      const amt = Math.round(raw / 1000) * 1000;
      const id = `INV-${1500 + ci * 17 + i}`;
      invoices.push(mkInv(id, c.id, amt, issue, due, `${c.erpId}/PO/${1200 + i * 37 + ci}`, descFor(c, i), {
        paidAmount: amt, status: "paid", paidDate: paid, currency: c.currency, entity: c.entity
      }));
      const pid = `PAY-${129000 + ci * 17 + i}`;
      payments.push({
        id: pid, customerId: c.id, payerName: c.name, amount: amt, currency: c.currency,
        receivedDate: paid, valueDate: paid, method: r() > 0.55 ? "Bank transfer" : "Wire transfer",
        bank: r() > 0.5 ? "First National Bank" : "Cornerstone Bank", reference: `${c.erpId}/${id}`,
        source: "bank_feed", status: "reconciled", matchState: "matched", erpPosted: true, autoApplied: r() > 0.25,
        remittanceId: null, confidence: 0.99, unappliedAmount: 0
      });
      allocations.push({ id: uid("ALC"), paymentId: pid, invoiceId: id, amount: amt, type: "invoice", createdBy: "agent" });
    }
  });
  return { invoices, payments, allocations };
}

/* Seed data is authored against ANCHOR. On load we shift every date in it by the
   distance between ANCHOR and the real current date, so the demo always reads as
   "today" and any action taken is stamped with the actual date it was taken. */
const SHIFT = dayDiff(TODAY, ANCHOR);
const DATE_RE = /^(\d{4})-(\d{2})-(\d{2})(T[\d:]{5,8})?$/;
function shiftDeep(v) {
  if (typeof v === "string") {
    const m = DATE_RE.exec(v);
    if (!m) return v;
    const shifted = addDays(v.slice(0, 10), SHIFT);
    return m[4] ? shifted + m[4] : shifted;
  }
  if (Array.isArray(v)) return v.map(shiftDeep);
  if (v && typeof v === "object") {
    const o = {};
    for (const k in v) o[k] = shiftDeep(v[k]);
    return o;
  }
  return v;
}

function buildInitialState() {
  const shifted = shiftDeep({
    today: ANCHOR, org: ORG, users: USERS, currentUserId: "u_arjun",
    customers: CUSTOMERS, contacts: CONTACTS,
    invoices: [...OPEN_INVOICES, ...HIST.invoices],
    creditNotes: CREDIT_NOTES, communications: COMMUNICATIONS, promises: PROMISES, disputes: DISPUTES,
    payments: [...LIVE_PAYMENTS, ...HIST.payments], allocations: [...LIVE_ALLOCATIONS, ...HIST.allocations],
    expected: EXPECTED_PAYMENTS, remittances: REMITTANCES, plans: PAYMENT_PLANS, portalEvents: PORTAL_EVENTS,
    agentActions: AGENT_ACTIONS, learning: LEARNING_SIGNALS, tasks: TASKS, campaigns: CAMPAIGNS,
    templates: TEMPLATES, integrations: INTEGRATIONS, policies: POLICIES, notifications: NOTIFICATIONS,
    audit: AUDIT_SEED, snapshots: FORECAST_SNAPSHOTS, intel: CUSTOMER_INTEL, matchOptions: MATCH_OPTIONS,
    toasts: [], firedEvents: [], suppressions: [], campaignOverrides: {}, campaignHolds: []
  });
  /* the viewing date itself is never shifted — it is the anchor the shift targets */
  return { ...shifted, today: TODAY };
}

/* ------------------------------- derivation ------------------------------ */
const BUCKETS = ["Current", "1–30", "31–60", "61–90", "90+"];
function bucketOf(daysOverdue) {
  if (daysOverdue <= 0) return "Current";
  if (daysOverdue <= 30) return "1–30";
  if (daysOverdue <= 60) return "31–60";
  if (daysOverdue <= 90) return "61–90";
  return "90+";
}
const toUSD = (amt, cur) => cur === "USD" ? amt : amt * (ORG.fx[cur] || 1);

function derive(state) {
  const custById = Object.fromEntries(state.customers.map((c) => [c.id, c]));
  const contactsByCust = by(state.contacts, "customerId");
  const allocByInv = by(state.allocations, "invoiceId");
  const openDisputes = state.disputes.filter((d) => d.status !== "resolved" && d.status !== "cancelled");
  const dispByInv = by(openDisputes, "invoiceId");
  const commsByCust = by(state.communications, "customerId");
  const promByCust = by(state.promises, "customerId");
  const plansByCust = by(state.plans, "customerId");
  const portalByCust = by(state.portalEvents, "customerId");

  /* invoices */
  const invoices = state.invoices.map((inv) => {
    const alloc = sum(allocByInv[inv.id] || [], (a) => a.amount);
    const paid = Math.max(inv.paidAmount, alloc);
    const balance = Math.max(0, inv.amount - paid);
    const status = balance <= 0.5 ? "paid" : paid > 0 ? "partially_paid" : "open";
    const daysOverdue = status === "paid" ? 0 : dayDiff(state.today, inv.dueDate);
    const disputed = status === "paid" ? 0 : sum(dispByInv[inv.id] || [], (d) => d.amount);
    return {
      ...inv, paidAmount: paid, balance, status,
      daysOverdue: Math.max(0, daysOverdue), rawDays: daysOverdue,
      bucket: status === "paid" ? "Paid" : bucketOf(daysOverdue),
      disputed: Math.min(disputed, balance), collectible: Math.max(0, balance - Math.min(disputed, balance)),
      usdBalance: toUSD(balance, inv.currency), customer: custById[inv.customerId]
    };
  });
  const invById = Object.fromEntries(invoices.map((i) => [i.id, i]));
  const invByCust = by(invoices, "customerId");

  /* predictions (recomputed on every event) */
  const predict = (inv) => {
    const c = custById[inv.customerId];
    const drivers = [];
    const hist = (invByCust[inv.customerId] || []).filter((x) => x.status === "paid" && x.paidDate);
    let conf = clamp(0.5 + hist.length * 0.06, 0.4, 0.86);
    let date = addDays(inv.dueDate, c.avgDelay);
    drivers.push({ t: `Historical pattern: settles about ${c.avgDelay} day${c.avgDelay === 1 ? "" : "s"} after terms`, k: c.avgDelay > 10 ? "neg" : "pos" });

    const plan = (plansByCust[inv.customerId] || []).find((p) => p.status === "active" && p.invoiceIds.includes(inv.id));
    const ptp = (promByCust[inv.customerId] || []).find((p) => p.status === "active" && p.invoiceIds.includes(inv.id));
    const broken = (promByCust[inv.customerId] || []).filter((p) => p.status === "broken" && dayDiff(state.today, p.promiseDate) < 75);
    const disp = (dispByInv[inv.id] || [])[0];
    const lastIn = sortBy(commsByCust[inv.customerId] || [], (x) => x.at, -1).find((x) => x.direction === "in");
    const portal = sortBy(portalByCust[inv.customerId] || [], (x) => x.at, -1)[0];

    if (plan) {
      const nxt = plan.installments.find((i) => i.status !== "paid");
      if (nxt) {date = nxt.dueDate;conf = 0.8;drivers.push({ t: `Payment plan ${plan.id}: next instalment due ${fmtDate(nxt.dueDate)}`, k: "pos" });}
      if (plan.installments.some((i) => i.status === "missed")) {date = addDays(state.today, 10);conf -= 0.2;drivers.push({ t: "An instalment on the plan has been missed", k: "neg" });}
    } else if (ptp) {
      date = ptp.promiseDate;conf = clamp(0.6 + ptp.confidence * 0.3, 0.5, 0.93);
      drivers.push({ t: `Customer committed ${money(ptp.amount)} for ${fmtDate(ptp.promiseDate)} (${ptp.source})`, k: "pos" });
      if (c.promiseTotal && c.promiseKept / c.promiseTotal < 0.6) {conf -= 0.18;drivers.push({ t: `Promise reliability is weak — ${c.promiseKept} of ${c.promiseTotal} kept`, k: "neg" });}
    }
    if (broken.length && !plan && !ptp) {
      const push = 12 + broken.length * 5;
      date = addDays(state.today, push);conf = clamp(conf - 0.12 * broken.length, 0.25, 0.8);
      drivers.push({ t: `${broken.length} broken promise${broken.length > 1 ? "s" : ""} in the last 75 days`, k: "neg" });
    } else if (broken.length && ptp) {
      date = addDays(date, 3);conf = clamp(conf - 0.11 * broken.length, 0.25, 0.8);
      drivers.push({ t: `${broken.length} earlier promise${broken.length > 1 ? "s were" : " was"} broken, so the committed date carries a buffer and lower confidence`, k: "neg" });
    }
    if (disp) {date = addDays(state.today, 21);conf = clamp(conf - 0.1, 0.25, 0.8);drivers.push({ t: `Dispute ${disp.id} is open on this invoice — ${money(disp.amount)} paused`, k: "neg" });}
    if (portal && dayDiff(state.today, portal.at.slice(0, 10)) <= 7) {
      if (portal.type === "payment.started" || portal.type === "payment.abandoned") {drivers.push({ t: "Payment started in the portal and abandoned within the last week", k: "neg" });conf += 0.02;} else
      {drivers.push({ t: "Recent payment portal activity", k: "pos" });}
    }
    if (inv.daysOverdue > 5 && (!lastIn || dayDiff(state.today, lastIn.at.slice(0, 10)) > 21)) {
      date = addDays(date, 5);conf -= 0.08;drivers.push({ t: "No inbound response in the last three weeks", k: "neg" });
    }
    if (dayDiff(state.today, date) > 0) {date = addDays(state.today, Math.max(2, Math.round(c.avgDelay / 3)));conf = clamp(conf - 0.1, 0.2, 0.7);}
    const drift = dayDiff(date, inv.dueDate);
    let status = "On track";
    if (hist.length < 2) status = "Insufficient history";else
    if (drift < 0) status = "Likely early";else
    if (drift <= 3) status = "On track";else
    if (drift <= 12) status = "Likely late";else
    status = "At risk";
    return { date, confidence: clamp(conf, 0.15, 0.95), status, drivers, drift };
  };

  const predictions = {};
  invoices.forEach((i) => {if (i.status !== "paid") predictions[i.id] = predict(i);});

  /* customers */
  const customers = state.customers.map((c) => {
    const inv = (invByCust[c.id] || []).filter((i) => i.status !== "paid");
    const paidInv = (invByCust[c.id] || []).filter((i) => i.status === "paid" && i.paidDate);
    const outstanding = sum(inv, (i) => i.usdBalance);
    const overdue = sum(inv.filter((i) => i.daysOverdue > 0), (i) => i.usdBalance);
    const buckets = Object.fromEntries(BUCKETS.map((b) => [b, sum(inv.filter((i) => i.bucket === b), (x) => x.usdBalance)]));
    const disputed = sum(inv, (i) => toUSD(i.disputed, i.currency));
    const oldest = inv.filter((i) => i.daysOverdue > 0).reduce((m, i) => Math.max(m, i.daysOverdue), 0);
    const comms = sortBy(commsByCust[c.id] || [], (x) => x.at, -1);
    const lastContact = comms.find((x) => x.direction === "out");
    const lastInbound = comms.find((x) => x.direction === "in");
    const proms = promByCust[c.id] || [];
    const activePtp = proms.find((p) => p.status === "active");
    const brokenPtp = proms.filter((p) => p.status === "broken" && dayDiff(state.today, p.promiseDate) < 75);
    const plan = (plansByCust[c.id] || []).find((p) => ["active", "approved", "missed_installment"].includes(p.status));
    const planRequest = (plansByCust[c.id] || []).find((p) => ["requested", "under_review"].includes(p.status));
    const disputes = openDisputes.filter((d) => d.customerId === c.id);
    const nextPred = sortBy(inv.filter((i) => predictions[i.id]), (i) => predictions[i.id].date)[0];
    const dsoDays = paidInv.length ? Math.round(sum(paidInv, (i) => dayDiff(i.paidDate, i.issueDate)) / paidInv.length) : null;
    const unapplied = sum(state.payments.filter((p) => p.customerId === c.id && p.matchState === "unapplied"), (p) => toUSD(p.unappliedAmount, p.currency));

    /* priority score with explainable factors */
    const f = [];
    let score = 0;
    const addF = (label, delta) => {if (delta) {score += delta;f.push({ label, delta });}};
    addF(`Overdue balance of ${compact(overdue)}`, Math.round(clamp(overdue / 469500, 0, 1) * 30));
    addF(oldest ? `Oldest overdue invoice at ${oldest} days` : "", Math.round(clamp(oldest / 60, 0, 1) * 20));
    addF(brokenPtp.length ? `${brokenPtp.length} broken promise${brokenPtp.length > 1 ? "s" : ""}` : "", brokenPtp.length * 9);
    if (overdue > 0 && (!lastInbound || dayDiff(state.today, lastInbound.at.slice(0, 10)) > 14)) addF("No inbound response in over two weeks", 10);
    if (nextPred && predictions[nextPred.id] && predictions[nextPred.id].drift > 10) addF("Predicted payment materially later than terms", 10);
    if (disputes.length) addF(`${disputes.length} open dispute${disputes.length > 1 ? "s" : ""} blocking ${compact(disputed)}`, 6);
    if (unapplied > 0) addF("Unapplied cash on the account", 4);
    if (plan && !plan.installments.some((i) => i.status === "missed")) addF("Approved payment plan is being serviced", -15);
    if (plan && plan.installments.some((i) => i.status === "missed")) addF("Payment plan instalment missed", 12);
    if (activePtp) addF(`Commitment recorded for ${fmtDate(activePtp.promiseDate)}`, -12);
    if (c.strategic) addF("Strategic account — relationship-managed", -6);
    if (lastContact && dayDiff(state.today, lastContact.at.slice(0, 10)) <= 3) addF("Contacted within the last three days", -5);
    score = Math.round(clamp(score, 0, 1500));
    const band = score >= 65 ? "Critical" : score >= 42 ? "High" : score >= 22 ? "Medium" : "Low";

    /* risk */
    let riskPts = 0;
    if (c.promiseTotal) riskPts += (1 - c.promiseKept / c.promiseTotal) * 35;
    riskPts += clamp(c.avgDelay / 30, 0, 1) * 25;
    riskPts += brokenPtp.length * 12;
    riskPts += disputes.length * 6;
    riskPts += outstanding > 0 ? clamp(overdue / Math.max(outstanding, 1), 0, 1) * 20 : 0;
    const risk = riskPts >= 55 ? "High" : riskPts >= 30 ? "Medium" : "Low";

    return {
      ...c, invoices: inv, allInvoices: invByCust[c.id] || [], outstanding, overdue, current: outstanding - overdue,
      buckets, disputed, oldest, lastContact, lastInbound, activePtp, brokenPtp, plan, planRequest, disputes,
      priority: score, priorityBand: band, priorityFactors: f, risk, riskPts: Math.round(riskPts),
      country: (ORG.entities.find((e) => e.id === c.entity) || {}).country || "United States",
      predicted: nextPred ? predictions[nextPred.id] : null, predictedInvoice: nextPred || null,
      dso: dsoDays, contacts: contactsByCust[c.id] || [], unapplied,
      owner: c.owner,
      campaignId: (state.campaignOverrides || {})[c.id] || (plan ? "cmp_plan" : brokenPtp.length ? "cmp_broken" : c.campaign),
      campaignHeld: (state.campaignHolds || []).includes(c.id),
      intel: state.intel[c.id] || DEFAULT_INTEL
    };
  });
  const custView = Object.fromEntries(customers.map((c) => [c.id, c]));

  /* portfolio */
  const openInv = invoices.filter((i) => i.status !== "paid");
  const totalAR = sum(openInv, (i) => i.usdBalance);
  const overdueAR = sum(openInv.filter((i) => i.daysOverdue > 0), (i) => i.usdBalance);
  const buckets = BUCKETS.map((b) => ({ bucket: b, amount: sum(openInv.filter((i) => i.bucket === b), (x) => x.usdBalance), count: openInv.filter((i) => i.bucket === b).length }));
  const sales90 = sum(invoices.filter((i) => dayDiff(state.today, i.issueDate) <= 90 && dayDiff(state.today, i.issueDate) >= 0), (i) => toUSD(i.amount, i.currency));
  const dso = sales90 > 0 ? Math.round(totalAR / sales90 * 90) : 0;
  const disputeExposure = sum(openDisputes, (d) => toUSD(d.amount, d.currency));
  const unappliedCash = sum(state.payments.filter((p) => ["unapplied", "exception"].includes(p.matchState)), (p) => toUSD(p.unappliedAmount, p.currency));
  const activePromises = state.promises.filter((p) => p.status === "active");
  const collected30 = sum(state.payments.filter((p) => dayDiff(state.today, p.receivedDate) <= 30 && dayDiff(state.today, p.receivedDate) >= 0), (p) => toUSD(p.amount, p.currency));

  /* cash expectation from predictions */
  const weekStart = (d) => {const dt = D(d);const off = (dt.getDay() + 6) % 7;return addDays(d, -off);};
  const thisWeek = weekStart(state.today),nextWeek = addDays(thisWeek, 7);
  const monthEnd = (() => {const dt = D(state.today);return new Date(dt.getFullYear(), dt.getMonth() + 1, 0).toISOString().slice(0, 10);})();
  const expectations = openInv.map((i) => {
    const p = predictions[i.id];
    const c = custView[i.customerId];
    const committed = !!(c.activePtp && c.activePtp.invoiceIds.includes(i.id)) || !!(c.plan && c.plan.invoiceIds.includes(i.id));
    return { invoice: i, date: p ? p.date : i.dueDate, amount: i.collectible ? toUSD(i.collectible, i.currency) : 0, committed, confidence: p ? p.confidence : 0.4 };
  });
  const inRange = (a, b) => expectations.filter((e) => e.date >= a && e.date < b);
  const cashExpect = {
    thisWeek: inRange(thisWeek, nextWeek), nextWeek: inRange(nextWeek, addDays(nextWeek, 7)),
    thisMonth: inRange(state.today, addDays(monthEnd, 1)),
    nextMonth: inRange(addDays(monthEnd, 1), addDays(monthEnd, 32)),
    collectedThisMonth: sum(state.payments.filter((p) => p.receivedDate >= state.today.slice(0, 8) + "01" && p.receivedDate <= state.today), (p) => toUSD(p.amount, p.currency))
  };

  /* rolling weekly forecast: 4 weeks back to 6 forward */
  const forecastWeeks = [];
  for (let w = -4; w <= 6; w++) {
    const ws = addDays(thisWeek, w * 7),we = addDays(ws, 7);
    const rows = inRange(ws, we);
    forecastWeeks.push({
      week: ws, label: fmtShort(ws), past: w < 0,
      predicted: w < 0 ? 0 : sum(rows.filter((r) => !r.committed), (r) => r.amount),
      committed: w < 0 ? 0 : sum(rows.filter((r) => r.committed), (r) => r.amount),
      collected: sum(state.payments.filter((p) => p.receivedDate >= ws && p.receivedDate < we), (p) => toUSD(p.amount, p.currency))
    });
  }

  const tasks = state.tasks.map((t) => ({ ...t, customer: custView[t.customerId], overdue: t.status !== "completed" && t.dueDate < state.today }));

  return {
    invoices, invById, invByCust, predictions, customers, custView, custById, contactsByCust, commsByCust,
    openDisputes, dispByInv, tasks, buckets, promByCust, plansByCust, portalByCust,
    portfolio: { totalAR, overdueAR, currentAR: totalAR - overdueAR, dso, disputeExposure, unappliedCash, activePromises, collected30, sales90, openInvoiceCount: openInv.length },
    cashExpect, forecastWeeks, weekStart: thisWeek
  };
}

/* Recompute the headline numbers for a subset of customers. Everything is summed
   from the same invoice and payment records the unfiltered view uses, so a region
   view and the portfolio view can never disagree. */
function scopeMetrics(state, d, custIds) {
  const set = custIds ? new Set(custIds) : null;
  const inScope = (cid) => (set ? set.has(cid) : true);
  const custs = d.customers.filter((c) => inScope(c.id));
  const openInv = d.invoices.filter((i) => i.status !== "paid" && inScope(i.customerId));
  const allInv = d.invoices.filter((i) => inScope(i.customerId));
  const pays = state.payments.filter((p) => p.customerId && inScope(p.customerId));

  const totalAR = sum(openInv, (i) => i.usdBalance);
  const overdueAR = sum(openInv.filter((i) => i.daysOverdue > 0), (i) => i.usdBalance);
  const sales90 = sum(allInv.filter((i) => dayDiff(state.today, i.issueDate) <= 90 && dayDiff(state.today, i.issueDate) >= 0), (i) => toUSD(i.amount, i.currency));
  const openDisputes = d.openDisputes.filter((x) => inScope(x.customerId));
  const buckets = BUCKETS.map((b) => ({ bucket: b, amount: sum(openInv.filter((i) => i.bucket === b), (x) => x.usdBalance), count: openInv.filter((i) => i.bucket === b).length }));
  const expect = {};
  ["thisWeek", "nextWeek", "thisMonth", "nextMonth"].forEach((k) => { expect[k] = d.cashExpect[k].filter((e) => inScope(e.invoice.customerId)); });
  expect.collectedThisMonth = sum(pays.filter((p) => p.receivedDate >= state.today.slice(0, 8) + "01" && p.receivedDate <= state.today), (p) => toUSD(p.amount, p.currency));

  return {
    customers: custs, invoices: openInv, buckets, cashExpect: expect,
    portfolio: {
      totalAR, overdueAR, currentAR: totalAR - overdueAR, sales90,
      dso: sales90 > 0 ? Math.round(totalAR / sales90 * 90) : 0,
      disputeExposure: sum(openDisputes, (x) => toUSD(x.amount, x.currency)),
      unappliedCash: sum(state.payments.filter((p) => ["unapplied", "exception"].includes(p.matchState) && (!p.customerId || inScope(p.customerId))), (p) => toUSD(p.unappliedAmount, p.currency)),
      collected30: sum(pays.filter((p) => dayDiff(state.today, p.receivedDate) <= 30 && dayDiff(state.today, p.receivedDate) >= 0), (p) => toUSD(p.amount, p.currency)),
      openInvoiceCount: openInv.length,
      openDisputeCount: openDisputes.length,
    },
  };
}

/* How exposed is this account to actually defaulting, and why. */
function defaultRisk(state, d, c) {
  const f = [];
  let s = 0;
  const add = (label, v) => { if (v > 0) { s += v; f.push({ label, v }); } };
  add(`${compact(c.overdue)} overdue`, Math.round(clamp(c.overdue / 600000, 0, 1) * 26));
  add(c.oldest ? `${c.oldest} days past due` : "", Math.round(clamp((c.oldest || 0) / 90, 0, 1) * 22));
  add(c.brokenPtp.length ? `${c.brokenPtp.length} broken commitment${c.brokenPtp.length > 1 ? "s" : ""}` : "", c.brokenPtp.length * 12);
  add(c.disputes.length ? `${compact(c.disputed)} disputed` : "", c.disputes.length ? 10 : 0);
  add(c.plan && c.plan.status === "missed_installment" ? "Payment plan slipping" : "", c.plan && c.plan.status === "missed_installment" ? 12 : 0);
  const silent = c.lastInbound ? dayDiff(state.today, c.lastInbound.at.slice(0, 10)) : 999;
  add(silent > 14 ? `No reply in ${silent > 900 ? "any" : silent + " days"}` : "", silent > 14 ? 10 : 0);
  add(c.outstanding > c.creditLimit ? "Over credit limit" : "", c.outstanding > c.creditLimit ? 14 : 0);
  return { score: Math.round(clamp(s, 0, 100)), factors: f };
}

/* --------------------------- next best action ---------------------------- */
function nextBestAction(state, d, customerId) {
  const c = d.custView[customerId];
  if (!c) return null;
  const pref = c.contacts.find((x) => x.id === (c.intel.bestContact || "")) || c.contacts[0];
  const openInv = c.invoices.filter((i) => i.daysOverdue > 0);
  const base = { customerId, contact: pref, invoices: openInv.map((i) => i.id), time: "Today, 10:30–11:30 IST" };
  const policyFor = (channel, autonomy) => ({ channel, autonomy, requiresApproval: autonomy === "draft" || autonomy === "recommend" });

  if (c.plan && c.plan.installments.some((i) => i.status === "missed")) {
    const m = c.plan.installments.find((i) => i.status === "missed");
    return { ...base, action: "whatsapp", title: "Contact about the missed instalment on WhatsApp", rationale: `Instalment ${m.n} of ${money(m.amount)} under plan ${c.plan.id} was not received. The plan is otherwise being serviced, so a short deferral is more likely to preserve the schedule than restarting invoice dunning.`, confidence: 0.86, ...policyFor("whatsapp", "execute") };
  }
  const planDue = c.plan && c.plan.installments.find((i) => i.status === "due" && i.dueDate < state.today);
  if (planDue) {
    return { ...base, action: "whatsapp", title: `Follow up instalment ${planDue.n}, due ${relDays(planDue.dueDate)}`, rationale: `Instalment ${planDue.n} of ${money(planDue.amount)} was due on ${fmtDate(planDue.dueDate)} and has not been received. Two reminders have already been delivered on WhatsApp.`, confidence: 0.81, ...policyFor("whatsapp", "execute") };
  }
  const expected = state.expected.find((e) => e.customerId === customerId && dayDiff(addDays(state.today, 3), e.expectedDate) >= 0 && e.state !== "overdue");
  if (expected) {
    return { ...base, action: "wait", title: `Hold — ${money(expected.amount)} is already on its way`, rationale: `${expected.basis} confirms payment of ${money(expected.amount)} for ${fmtDate(expected.expectedDate)}. Sending a reminder now would contact a customer who has already paid, so the agent is waiting for the bank feed instead.`, confidence: 0.9, ...policyFor("none", "execute") };
  }
  const readyDispute = c.disputes.find((x) => x.status === "evidence_ready");
  if (readyDispute) {
    return { ...base, action: "dispute_response", title: `Send the dispute response for ${readyDispute.id}`, rationale: `Evidence for ${readyDispute.id} is complete and the assessment is ${titleCase(readyDispute.assessment.verdict)} at ${pct(readyDispute.assessment.confidence)} confidence. Answering the freight question unblocks ${compact(c.outstanding - c.disputed)} of undisputed balance on the same invoice.`, confidence: readyDispute.assessment.confidence, ...policyFor("email", "draft"), disputeId: readyDispute.id };
  }
  if (c.activePtp) {
    const weak = c.brokenPtp.length > 0;
    return {
      ...base, action: "wait", title: `Hold — commitment recorded for ${fmtDate(c.activePtp.promiseDate)}`,
      rationale: weak ?
      `${money(c.activePtp.amount)} was committed via ${c.activePtp.source} on ${fmtDate(c.activePtp.createdAt)}, so reminders are suppressed until the day after the promised date. Confidence is reduced because ${c.brokenPtp.length} earlier commitment${c.brokenPtp.length > 1 ? "s were" : " was"} not honoured — the escalation task stays open in parallel and the bank feed is checked on the promised date.` :
      `${money(c.activePtp.amount)} was committed via ${c.activePtp.source} on ${fmtDate(c.activePtp.createdAt)}. Reminders stay suppressed until the day after the promised date. Contacting now would work against a commitment this customer has usually honoured.`,
      confidence: weak ? 0.62 : 0.79, ...policyFor("none", "execute")
    };
  }
  if (c.brokenPtp.length >= 2) {
    return { ...base, action: "escalate", title: "Escalate to the relationship owner for a senior call", rationale: `${c.brokenPtp.length} promises have been broken in the current cycle and there has been no reply since ${c.lastInbound ? fmtDate(c.lastInbound.at.slice(0, 10)) : "the last outbound message"}. Automated channels have been exhausted — three outbound messages in eleven days reaches the contact-frequency limit.`, confidence: 0.83, contact: c.contacts.find((x) => x.role.includes("Controller")) || pref, ...policyFor("call", "draft") };
  }
  const portal = sortBy(d.portalByCust[customerId] || [], (x) => x.at, -1)[0];
  if (portal && portal.type === "payment.abandoned" && dayDiff(state.today, portal.at.slice(0, 10)) <= 7) {
    return { ...base, action: "email", title: "Send a payment link follow-up — payment was abandoned", rationale: `The customer opened the portal on ${fmtDate(portal.at.slice(0, 10))} and left at payment method selection. Intent is evident, so a payment link with the saved selection is more useful than a standard reminder.`, confidence: 0.74, ...policyFor("email", "execute") };
  }
  if (c.brokenPtp.length === 1) {
    return { ...base, action: "call", title: "Call the AP manager to re-secure a date", rationale: `A promise was broken on ${fmtDate(c.brokenPtp[0].promiseDate)}. This customer historically responds to phone contact rather than email.`, confidence: 0.8, ...policyFor("call", "execute") };
  }
  if (c.overdue > 0) {
    const chan = c.channel === "phone" ? "call" : c.channel;
    const recent = c.lastContact && dayDiff(state.today, c.lastContact.at.slice(0, 10)) <= 3;
    if (recent) return { ...base, action: "wait", title: "Hold — contacted within the last three days", rationale: `The contact-frequency policy allows two outbound messages a week. The last message went out on ${fmtDate(c.lastContact.at.slice(0, 10))}.`, confidence: 0.7, ...policyFor("none", "execute") };
    return { ...base, action: chan, title: `Send an overdue reminder by ${chan === "call" ? "phone" : titleCase(chan)}`, rationale: `${compact(c.overdue)} is overdue with the oldest invoice at ${c.oldest} days. ${c.intel.channel}`, confidence: 0.77, ...policyFor(chan, c.strategic ? "recommend" : "execute") };
  }
  return { ...base, action: "wait", title: "No action needed", rationale: "Nothing is overdue and the predicted payment dates are within terms.", confidence: 0.9, ...policyFor("none", "execute") };
}

/* ------------------------------ match engine ----------------------------- */
function suggestMatchesFor(state, d, payment) {
  if (state.matchOptions[payment.id]) return state.matchOptions[payment.id];
  const rem = state.remittances.find((r) => r.linkedPaymentId === payment.id || r.customerId === payment.customerId && r.extracted.totalAmount === payment.amount);
  if (rem && rem.extracted.lines.length) {
    return [{
      id: "opt_a", confidence: 0.98, label: `Remittance ${rem.id} — ${rem.extracted.lines.length} invoice${rem.extracted.lines.length > 1 ? "s" : ""} matched exactly`,
      allocations: rem.extracted.lines.map((l) => ({ invoiceId: l.invoice, amount: l.amount, type: "cash" })),
      evidence: [`Invoice numbers found in remittance advice ${rem.id}`, "Line amounts reconcile to the credit exactly", `Payer name matches the customer master (${rem.extracted.payer})`, "Bank account has been used by this customer before"]
    }];
  }
  const cust = payment.customerId ? d.custView[payment.customerId] : null;
  if (cust) {
    let left = payment.amount;
    const allocs = [];
    sortBy(cust.invoices, (i) => i.dueDate).forEach((i) => {if (left <= 0) return;const a = Math.min(left, i.balance);allocs.push({ invoiceId: i.id, amount: a, type: "cash" });left -= a;});
    return [{ id: "opt_a", confidence: 0.72, label: "Oldest open invoices first", allocations: allocs, evidence: ["Payer identified from the bank descriptor", "No remittance advice received — allocation follows the oldest-first policy"] }];
  }
  return [{ id: "opt_a", confidence: 0.2, label: "Hold as unapplied cash", allocations: [], evidence: ["Payer could not be identified from the bank descriptor"] }];
}

/* apply allocations, post to ERP, update collections */
function applyAllocations(state, paymentId, allocations, meta) {
  const pay = state.payments.find((p) => p.id === paymentId);
  if (!pay) return state;
  const cashAllocs = allocations.filter((x) => x.type === "cash" || x.type === "invoice");
  const cashTotal = sum(cashAllocs, (x) => x.amount);
  const custId = pay.customerId || cashAllocs[0] && state.invoices.find((i) => i.id === cashAllocs[0].invoiceId)?.customerId || null;
  const newAllocs = allocations.filter((x) => x.amount > 0 && x.type !== "deduction").map((x) => ({ id: nid("ALC"), paymentId, invoiceId: x.invoiceId, amount: x.amount, type: x.type === "cash" ? "invoice" : x.type, ref: x.ref, reason: x.reason, createdBy: meta.actorType === "ai" ? "agent" : "human" }));
  const diff = allocations.filter((x) => x.type === "difference" || x.type === "deduction");

  let s = {
    ...state,
    allocations: [...state.allocations, ...newAllocs],
    payments: state.payments.map((p) => p.id === paymentId ? { ...p, customerId: custId || p.customerId, matchState: "matched", status: "reconciled", erpPosted: true, autoApplied: !!meta.auto, unappliedAmount: Math.max(0, p.amount - cashTotal), confidence: meta.confidence, appliedAt: nowStamp(), appliedBy: meta.actor } : p),
    remittances: state.remittances.map((r) => r.linkedPaymentId === paymentId || r.customerId === custId && r.status === "parsed" && Math.abs((r.extracted.totalAmount || 0) - pay.amount) < 1 ? { ...r, status: "matched", linkedPaymentId: paymentId } : r)
  };

  const invIds = uniq(newAllocs.map((x) => x.invoiceId));
  const cleared = invIds.filter((id) => {
    const inv = s.invoices.find((i) => i.id === id);
    const applied = sum(s.allocations.filter((x) => x.invoiceId === id), (x) => x.amount);
    return applied >= inv.amount - 0.5;
  });

  s = { ...s, promises: s.promises.map((p) => p.customerId === custId && p.status === "active" && p.invoiceIds.some((i) => cleared.includes(i)) ? { ...p, status: "fulfilled", fulfilledAt: state.today } : p) };
  s = { ...s, tasks: s.tasks.map((t) => t.paymentId === paymentId && t.status !== "completed" ? { ...t, status: "completed" } : t) };

  /* A short payment is not a rounding difference. Every deduction becomes a real,
     trackable case with an owner — it appears alongside disputes, on the invoice
     journey and in the work queue until somebody decides on it. */
  const deductions = allocations.filter((x) => x.type === "deduction" && x.amount > 0);
  if (deductions.length) {
    const cases = deductions.map((x) => {
      const inv = s.invoices.find((i) => i.id === x.invoiceId);
      return {
        id: nid("DED"), customerId: custId, invoiceId: x.invoiceId, amount: x.amount, currency: pay.currency,
        reason: "deduction", kind: "deduction", source: "short payment", status: "evidence_ready",
        createdAt: state.today, owner: "u_sneha", slaDue: addDays(state.today, 7),
        assessment: {
          verdict: "uncertain", confidence: 0.5,
          summary: `${money(x.amount, pay.currency)} was withheld from payment ${paymentId} against ${x.invoiceId} with no reason given on the remittance. The customer has taken an unapproved allowance this way before.`,
          missing: ["Written reason from the customer", "Any credit note or approval covering the amount"],
          recommended: "request_document"
        },
        evidence: [
          { id: uid("ev"), type: "Payment", name: paymentId, detail: `${money(pay.amount, pay.currency)} received against an invoice of ${money(inv ? inv.amount : 0, pay.currency)}.`, relevance: "neutral", source: pay.bank },
          { id: uid("ev"), type: "Invoice", name: x.invoiceId, detail: inv ? inv.desc : "", relevance: "supports_us", source: "SAP S/4HANA" }
        ],
        timeline: [{ t: `Short payment of ${money(x.amount, pay.currency)} identified during cash application`, at: nowStamp(), by: "Cash Application Agent", kind: "ai" }]
      };
    });
    const dedTasks = cases.map((cse) => ({
      id: nid("TSK"), type: "Dispute", customerId: custId, invoiceIds: [cse.invoiceId], disputeId: cse.id,
      owner: "u_sneha", createdBy: "Cash Application Agent", createdAt: nowStamp(), dueDate: addDays(state.today, 3),
      priority: "high", status: "open", group: "dispute", sla: addDays(state.today, 7),
      title: `Deduction case ${cse.id} — ${money(cse.amount, pay.currency)} withheld on ${cse.invoiceId}`,
      notes: [{ by: "Cash Application Agent", at: nowStamp(), t: "Cash posted in full; the shortfall is held as a deduction case rather than written off." }]
    }));
    s = { ...s, disputes: [...cases, ...s.disputes], tasks: [...dedTasks, ...s.tasks] };
    s = log(s, {
      audit: { actor: meta.actor, actorType: meta.actorType, object: cases[0].id, action: "deduction.case_created", prev: "short payment", next: `${money(cases[0].amount, pay.currency)} held as a deduction case on ${cases[0].invoiceId}`, source: "Cash application", workflow: "Deduction management", customerId: custId },
      notif: { title: "Deduction case opened", body: `${money(cases[0].amount, pay.currency)} withheld on ${cases[0].invoiceId}. Assigned to Laura Bennett.`, kind: "neg", link: { screen: "disputes_open" } }
    });
  }

  s = log(s, {
    audit: { actor: meta.actor, actorType: meta.actorType, object: paymentId, action: "cash.applied", prev: "unapplied", next: `${money(cashTotal, pay.currency)} allocated across ${invIds.length} invoice${invIds.length > 1 ? "s" : ""}`, source: "Pineloop AI", workflow: "Cash application", customerId: custId }
  });
  s = log(s, {
    audit: { actor: "SAP S/4HANA", actorType: "integration", object: paymentId, action: "erp.posted", prev: "not posted", next: `posted with idempotency key ${paymentId}-01`, source: "SAP S/4HANA", workflow: "Cash application", customerId: custId },
    agent: {
      agent: "Cash Application Agent", customerId: custId, object: paymentId,
      decision: meta.auto ? "Auto-apply and post to the ERP" : "Apply the allocation confirmed by the specialist",
      action: `${money(cashTotal, pay.currency)} allocated${cleared.length ? `; ${cleared.join(", ")} settled in full` : ""}${diff.length ? `; ${diff.map((x) => `${x.reason} ${money(x.amount)}`).join(", ")}` : ""}`,
      autonomy: meta.auto ? "workflow" : "execute", confidence: meta.confidence, outcome: "Posted to the ERP; collection stopped on settled invoices",
      policy: meta.auto ? `Auto-post permitted: confidence ≥ ${state.policies.financial.autoPostMinConfidence}, amount ≤ ${money(state.policies.financial.autoPostMaxAmount)}, remittance matched exactly` : "Human-confirmed allocation, posted under the specialist's authority",
      inputs: meta.evidence || [], alternatives: [], expected: "Invoice balances updated, campaigns stopped, forecast recalculated"
    },
    notif: { title: meta.auto ? "Payment applied automatically" : "Payment applied", body: `${money(cashTotal, pay.currency)} posted to the ERP${cleared.length ? ` — ${cleared.length} invoice${cleared.length > 1 ? "s" : ""} settled` : ""}.`, kind: "pos", link: { screen: "incoming_payments" } },
    toast: { t: meta.auto ? "Applied straight through" : "Cash applied", m: `${money(cashTotal, pay.currency)} posted. Invoice balances, collections, forecast and analytics have all updated.` }
  });

  if (cleared.length) {
    s = log(s, { agent: { agent: "AR Orchestrator", customerId: custId, object: cleared.join(", "), decision: "Stop collection on settled invoices", action: `Removed ${cleared.length} invoice${cleared.length > 1 ? "s" : ""} from active campaign steps`, autonomy: "execute", confidence: 1, outcome: "Collection stopped", policy: "A settled invoice is removed from future collection steps immediately", inputs: ["Invoice balance reached zero after posting"], alternatives: [], expected: "No further reminders about these invoices" } });
  }
  if (meta.correction) {
    s = { ...s, learning: [{ id: nid("ls"), at: state.today, type: "cash_match_corrected", customerId: custId, summary: meta.correction.summary, pattern: meta.correction.pattern, appliedTo: "Cash Application Agent", status: "captured — will influence future ranking" }, ...s.learning] };
    s = log(s, { audit: { actor: meta.actor, actorType: "human", object: paymentId, action: "human.override", prev: "AI ranked option", next: meta.correction.summary, source: "Pineloop AI", workflow: "Learning", customerId: custId } });
  }
  return s;
}

function DataTable({ columns, rows, onRow, rowKey = (r) => r.id, empty, pageSize = 14, selectable, selected = [], onSelect, footNote, expand }) {
  const [sort, setSort] = useState(null);
  const [page, setPage] = useState(0);
  const [openRow, setOpenRow] = useState(null);
  useEffect(() => { setPage(0); }, [rows.length]);
  const sorted = useMemo(() => {
    if (!sort) return rows;
    const col = columns.find((c) => c.k === sort.k);
    if (!col || !col.sort) return rows;
    return sortBy(rows, col.sort, sort.dir);
  }, [rows, sort, columns]);
  const pages = Math.max(1, Math.ceil(sorted.length / pageSize));
  const view = sorted.slice(page * pageSize, page * pageSize + pageSize);
  const allSel = selectable && view.length > 0 && view.every((r) => selected.includes(rowKey(r)));
  if (!rows.length) return <div className="a-card-b">{empty || <Empty title="Nothing here">No records match the current filters.</Empty>}</div>;
  return (
    <>
      <div className="a-scroll-x">
        <table className="a-table">
          <thead>
            <tr>
              {selectable && <th style={{ width: 34 }}><input type="checkbox" checked={allSel} onChange={() => onSelect(allSel ? selected.filter((id) => !view.some((r) => rowKey(r) === id)) : uniq([...selected, ...view.map(rowKey)]))} aria-label="Select all on this page" /></th>}
              {expand && <th style={{ width: 26 }} />}
              {columns.map((c) => (
                <th key={c.k} className={c.num ? "num" : ""} style={c.w ? { width: c.w } : undefined}>
                  {c.sort ? (
                    <span className="a-th-sort" onClick={() => setSort((s) => (s && s.k === c.k ? { k: c.k, dir: -s.dir } : { k: c.k, dir: 1 }))}>
                      {c.h}{sort && sort.k === c.k ? (sort.dir === 1 ? <ChevronDown size={11} /> : <ChevronDown size={11} style={{ transform: "rotate(180deg)" }} />) : null}
                    </span>
                  ) : c.h}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {view.map((r) => {
              const key = rowKey(r);
              const isOpen = expand && openRow === key;
              return (
                <React.Fragment key={key}>
                  <tr className={`${onRow || expand ? "clickable" : ""} ${selected.includes(key) ? "sel" : ""}`}
                    onClick={(e) => { if (e.target.type === "checkbox") return; if (expand) setOpenRow(isOpen ? null : key); else if (onRow) onRow(r); }}>
                    {selectable && <td><input type="checkbox" checked={selected.includes(key)} onChange={() => onSelect(selected.includes(key) ? selected.filter((x) => x !== key) : [...selected, key])} aria-label="Select row" /></td>}
                    {expand && <td style={{ width: 26, paddingRight: 0 }}><ChevronRight size={13} className="a-muted" style={{ transform: isOpen ? "rotate(90deg)" : "none", transition: "transform .12s" }} /></td>}
                    {columns.map((c) => (<td key={c.k} className={`${c.num ? "num" : ""} ${c.wrap ? "wrap" : ""}`} style={c.w ? { width: c.w, minWidth: c.w } : undefined}>{c.render(r)}</td>))}
                  </tr>
                  {isOpen && (
                    <tr className="a-expand"><td colSpan={columns.length + (selectable ? 1 : 0) + 1}>
                      <div className="a-expand-in">{expand(r)}</div>
                    </td></tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="a-tfoot">
        <span>{sorted.length} record{sorted.length === 1 ? "" : "s"}{footNote ? ` · ${footNote}` : ""}</span>
        {pages > 1 && (
          <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6 }}>
            <button className="a-btn xs" disabled={page === 0} onClick={() => setPage((p) => p - 1)}><ChevronLeft size={13} /></button>
            <span>Page {page + 1} of {pages}</span>
            <button className="a-btn xs" disabled={page >= pages - 1} onClick={() => setPage((p) => p + 1)}><ChevronRight size={13} /></button>
          </span>
        )}
      </div>
    </>
  );
}

function lifecycleFor(state, d, customerId) {
  const c = d.custView[customerId];
  const comms = sortBy(d.commsByCust[customerId] || [], (x) => x.at, -1);
  const out = comms.filter((x) => x.direction === "out");
  const inb = comms.filter((x) => x.direction === "in");
  const pays = state.payments.filter((p) => p.customerId === customerId);
  const applied = pays.filter((p) => p.matchState === "matched");
  const posted = applied.filter((p) => p.erpPosted);
  const openInv = c.invoices.length;
  const st = (done, active, blocked) => (blocked ? "blocked" : done ? "done" : active ? "active" : "");
  return [
    { name: "Invoice", value: `${openInv} open`, sub: compact(c.outstanding), state: st(openInv === 0, openInv > 0) },
    { name: "Outreach", value: out.length ? `${out.length} sent` : "None", sub: c.lastContact ? relDays(c.lastContact.at.slice(0, 10)) : "—", state: st(false, out.length > 0) },
    { name: "Response", value: inb.length ? `${inb.length} received` : "No reply", sub: c.lastInbound ? relDays(c.lastInbound.at.slice(0, 10)) : "—", state: inb.length ? "done" : c.overdue > 0 ? "blocked" : "" },
    { name: "Commitment", value: c.activePtp ? "Active" : c.brokenPtp.length ? "Broken" : c.plan ? "Payment plan" : "None", sub: c.activePtp ? fmtDate(c.activePtp.promiseDate) : c.brokenPtp.length ? `${c.brokenPtp.length} broken` : c.plan ? c.plan.id : "—", state: c.brokenPtp.length ? "blocked" : c.activePtp || c.plan ? "active" : "" },
    { name: "Payment", value: pays.length ? `${pays.length} received` : "Awaited", sub: pays.length ? compact(sum(pays, (p) => toUSD(p.amount, p.currency))) : "—", state: st(false, pays.length > 0) },
    { name: "Cash applied", value: applied.length === pays.length && pays.length ? "Complete" : `${applied.length}/${pays.length || 0}`, sub: pays.length - applied.length ? `${pays.length - applied.length} in exception` : "—", state: pays.length && applied.length === pays.length ? "done" : pays.length ? "blocked" : "" },
    { name: "ERP", value: posted.length ? "Posted" : "Pending", sub: c.disputed ? `${compact(c.disputed)} disputed` : c.outstanding ? `${compact(c.outstanding)} open` : "Closed", state: c.disputed ? "blocked" : c.outstanding === 0 ? "done" : posted.length ? "active" : "" },
  ];
}

              ))}
            </div>
          </div>
        )}
        <div>
          <div className="a-label">Policy checks</div>
          <div className="a-note" style={{ marginTop: 6 }}>{action.policy}</div>
        </div>
        <div>
          <div className="a-label">Expected next state</div>
          <div style={{ fontSize: 13, marginTop: 5 }}>{action.expected}</div>
        </div>
        <div>
          <div className="a-label">Outcome</div>
          <div style={{ fontSize: 13, marginTop: 5 }}>{action.outcome}</div>
        </div>
        <div className="a-note">A summary of the inputs and policy checks behind the decision, not a model transcript.</div>
      </div>
    </Drawer>
  );
}

function OverviewScreen() {

  const [horizon, setHorizon] = useState("thisWeek");

  const countries = uniq(d.customers.map((c) => c.country)).sort();
  const regions = uniq(d.customers.filter((c) => country === "all" || c.country === country).map((c) => c.geo).filter(Boolean)).sort();

  const inScope = (c) => (country === "all" || c.country === country) && (region === "all" || c.geo === region);
  const scoped = useMemo(() => {
    const ids = d.customers.filter(inScope).map((c) => c.id);
    return scopeMetrics(state, d, ids.length === d.customers.length ? null : ids);
  }, [state, d, country, region]);
  const filtered = country !== "all" || region !== "all";

  const rows = expect[horizon] || [];

  /* the ten accounts most likely to cost money, worst first */
  const atRisk = sortBy(
    scoped.customers.filter((c) => c.outstanding > 0).map((c) => ({ ...c, dr: defaultRisk(state, d, c) })),

          </select>
          <select className="a-select" style={{ width: 136 }} value={region} onChange={(e) => setRegion(e.target.value)} aria-label="Region">
            {["all", ...regions].map((g) => <option key={g} value={g}>{g === "all" ? "All regions" : g}</option>)}

          <button className="a-btn" onClick={() => nav({ screen: "forecast" })}><TrendingUp size={14} />Forecast</button>
          <button className="a-btn pri" onClick={() => nav({ screen: "work_queue" })}><ListChecks size={14} />Work queue</button>
        </>} />

      <div className="a-grid" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(168px,1fr))", marginBottom: 10 }}>
        <Stat label="Total AR" value={compact(p.totalAR)} sub={`${p.openInvoiceCount} open invoices`} hint="Everything invoiced and not yet paid, today" icon={Wallet} onClick={() => nav({ screen: "accounts" })} />
        <Stat label="Overdue AR" value={compact(p.overdueAR)} sub={`${pct(p.overdueAR / Math.max(p.totalAR, 1))} of the portfolio`} hint="Past its due date as of today" kind="neg" icon={AlertTriangle} onClick={() => openInvoiceList({ title: "Overdue invoices", filter: listFilter((i) => i.daysOverdue > 0) })} />
        <Stat label="Current AR" value={compact(p.currentAR)} sub="Within agreed terms" hint="Issued but not yet due" kind="pos" icon={CheckCircle2} onClick={() => openInvoiceList({ title: "Current invoices", filter: listFilter((i) => i.daysOverdue <= 0) })} />
        <Stat label="DSO" value={`${p.dso} days`} hint={`Days sales outstanding, on ${compact(p.sales90)} billed in the last 90 days`} icon={Gauge} />

      <div className="a-grid" style={{ gridTemplateColumns: "1.35fr 1fr", marginBottom: 14 }}>

          <div style={{ height: 168 }}>

            {[["thisWeek", "This week"], ["nextWeek", "Next week"], ["thisMonth", "This month"], ["nextMonth", "Next month"]].map(([k, l]) => (
              <Chip key={k} on={horizon === k} onClick={() => setHorizon(k)}>{l}</Chip>

          <div style={{ display: "grid", gap: 9 }}>

              <div className="a-label">Customer committed</div>

            </div>
            <div>
              <div className="a-label">Model predicted</div>
              <div style={{ fontSize: 17.5, fontWeight: 650 }}>{compact(model)}</div>
              <div className="a-hint">No commitment on record, so the date comes from how this customer has actually paid before</div>
            </div>

    </div>
  );

/* ------------------------------ CAMPAIGNS -------------------------------- */
function matchRule(c, r) {
  const v = String(r.v || "");
  const list = v.split(",").map((x) => x.trim());
  switch (r.f) {
    case "segment": return r.op === "in" ? list.includes(c.segment) : c.segment === v;
    case "tier": return r.op === "in" ? list.includes(c.tier) : r.op === "!=" ? c.tier !== v : c.tier === v;
    case "balance": return r.op === ">=" ? c.outstanding >= +v : r.op === "<" ? c.outstanding < +v : c.outstanding === +v;
    case "broken_ptp": return c.brokenPtp.length >= +v;
    case "payment_plan": return !!c.plan;
    case "geo": return list.includes(c.geo);
    case "risk": return list.includes(c.risk);
    default: return true;
  }
}
function campaignAudience(state, d, camp) {
  const enrolled = [], suppressed = [];
  d.customers.filter((c) => c.outstanding > 0).forEach((c) => {
    const results = camp.audience.rules.map((r) => matchRule(c, r));
    const match = camp.audience.match === "all" ? results.every(Boolean) : results.some(Boolean);
    if (!match) return;
    const reasons = [];
    if (camp.exclusions.includes("disputed_amount") && c.disputes.length) reasons.push(`${compact(c.disputed)} paused by dispute ${c.disputes[0].id}`);
    if (camp.exclusions.includes("payment_plan") && c.plan && camp.id !== "cmp_plan") reasons.push(`Payment plan ${c.plan.id} is servicing this account`);
    if (camp.exclusions.includes("active_ptp") && c.activePtp) reasons.push(`Promise to pay active until ${fmtDate(c.activePtp.promiseDate)}`);
    if (camp.exclusions.includes("recent_contact") && c.lastContact && dayDiff(state.today, c.lastContact.at.slice(0, 10)) <= 3) reasons.push(`Contacted ${relDays(c.lastContact.at.slice(0, 10))}`);
    if (camp.exclusions.includes("strategic") && c.strategic) reasons.push("Strategic account — excluded from automated outreach");
    if (c.campaignHeld) reasons.push("Held from automated outreach by a person");
    if (reasons.length && !(camp.id === "cmp_plan")) suppressed.push({ c, reasons });
    else enrolled.push(c);
  });
  return { enrolled, suppressed };
}

const timing = (s) => {
  const n = Math.abs(s.offset);
  if (s.unit === "days_before_due") return `${n} days before the due date`;
  if (s.unit === "days_overdue") return s.offset === 0 ? "On the due date" : `${n} days overdue`;
  if (s.unit === "days_before_installment") return `${n} days before an instalment`;
  if (s.unit === "days_after_installment") return `${n} days after a missed instalment`;
  return `${n} days after the trigger`;
};

function CampaignBuilder({ camp: initial, onClose }) {

  const set = (patch) => setCamp((c) => ({ ...c, ...patch }));

    <Drawer open onClose={onClose} wide title={camp.name} subtitle="Change the sequence, or pause the campaign. Suppression rules always apply."
      footer={<>
        <button className="a-btn pri" onClick={() => { dispatch({ type: "CAMPAIGN_SAVE", campaign: camp }); onClose(); }}><Check size={14} />Save</button>

        <button className="a-btn ghost" onClick={onClose}>Cancel</button>

        <div>
          <div className="a-label" style={{ marginBottom: 8 }}>Steps</div>

                <span style={{ fontWeight: 650, fontSize: 12, width: 16 }}>{i + 1}</span>
                <input className="a-input" style={{ width: 58 }} type="number" value={s.offset} onChange={(e) => setStep(s.id, { offset: +e.target.value })} />
                <select className="a-select" style={{ width: 168 }} value={s.unit} onChange={(e) => setStep(s.id, { unit: e.target.value })}>

                  {STEP_ACTIONS.map((x) => <option key={x.id} value={x.id}>{STEP_SENTENCE[x.id] || x.label}</option>)}
                </select>
                <Switch on={s.autonomy === "execute"} onChange={(v) => setStep(s.id, { autonomy: v ? "execute" : "draft" })} label="Send automatically" />
                <button className="a-btn xs ghost" onClick={() => set({ steps: camp.steps.filter((x) => x.id !== s.id) })}><Trash2 size={13} /></button>
              </div>
            ))}
          </div>
          <button className="a-btn" style={{ marginTop: 10 }} onClick={() => set({ steps: [...camp.steps, { id: uid("s"), offset: camp.steps.length ? camp.steps[camp.steps.length - 1].offset + 10 : 5, unit: "days_overdue", action: "email", template: "tpl_reminder", autonomy: "execute" }] })}><Plus size={14} />Add a step</button>
        </div>

        <div>
          <div className="a-label" style={{ marginBottom: 8 }}>Accounts on this campaign</div>
          <DataTable rows={enrolled} pageSize={6}
            columns={[

              { k: "o", h: "Outstanding", num: true, render: (r) => compact(r.outstanding) },

const CLASS_LABEL = { promise_to_pay: "Promise to pay", payment_confirmation: "Payment confirmation", dispute: "Dispute", deduction: "Deduction", request_invoice: "Invoice request", request_statement: "Statement request", payment_plan_request: "Payment plan request", question: "Question", escalation: "Escalation", other: "Other" };

/* Plain-language summary of everything said with one customer, across channels. */
function conversationSummary(state, d, customerId) {
  const c = d.custView[customerId];
  const msgs = sortBy(d.commsByCust[customerId] || [], (m) => m.at);
  if (!msgs.length) return { lines: ["No conversation on record with this customer yet."], last: null };
  const out = msgs.filter((m) => m.direction === "out"), inb = msgs.filter((m) => m.direction === "in");
  const chans = uniq(msgs.map((m) => (m.channel === "whatsapp" ? "WhatsApp" : titleCase(m.channel))));
  const lines = [];
  lines.push(`${msgs.length} messages exchanged across ${chans.join(", ")} — ${out.length} sent, ${inb.length} received. Last contact ${relDays(msgs[msgs.length - 1].at.slice(0, 10))}.`);
  if (c.activePtp) lines.push(`They committed to paying ${money(c.activePtp.amount)} by ${fmtDate(c.activePtp.promiseDate)}, so reminders are paused until then.`);
  if (c.brokenPtp.length) lines.push(`${c.brokenPtp.length} earlier commitment${c.brokenPtp.length === 1 ? " was" : "s were"} not honoured, which is why the tone of recent messages hardened.`);
  if (c.disputes.length) lines.push(`${c.disputes.map((x) => `${money(x.amount)} is queried on ${x.invoiceId} over ${titleCase(x.reason).toLowerCase()}`).join("; ")}. Only that amount is on hold.`);
  const payMsg = inb.find((m) => m.classification === "payment_confirmation");
  if (payMsg) lines.push(`They confirmed a payment was released, and cash application is matching it against the bank feed.`);
  if (!inb.length) lines.push(`They have not replied to anything yet, which is weighing on the risk score.`);
  lines.push(`Currently ${money(c.outstanding)} is open, ${money(c.overdue)} of it overdue.`);
  return { lines, last: msgs[msgs.length - 1] };
}

  }, -1), [d]);
  const filtered = custs.filter((c) => {
    if (!q) return true;
    const ql = q.toLowerCase();
    if (c.name.toLowerCase().includes(ql)) return true;
    return (d.commsByCust[c.id] || []).some((m) => (m.subject || "").toLowerCase().includes(ql) || (m.body || "").toLowerCase().includes(ql));

  const cid = selCust && filtered.some((c) => c.id === selCust) ? selCust : filtered[0]?.id;

                  <span className="a-muted" style={{ fontSize: 11 }}>{fmtShort(m.at.slice(0, 10))}</span>
                </div>
                <div className="a-dim" style={{ fontSize: 12, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {m.direction === "in" ? "" : "You: "}{m.subject || (m.body || "").slice(0, 50)}
                </div>
                <div className="a-muted" style={{ fontSize: 11, marginTop: 3 }}>{(d.commsByCust[c.id] || []).length} messages · {compact(c.outstanding)} open</div>
              </div>
            );
          })}
          {!filtered.length && <Empty icon={Inbox} title="No matches">Try another search term.</Empty>}
        </div>

        <div className="a-split-r">
          {!cust ? <Empty icon={Mail} title="Select a customer">Choose a conversation on the left.</Empty> : (
            <div style={{ padding: 18 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 14, flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 200 }}>
                  <button className="a-btn ghost sm" style={{ padding: 0 }} onClick={() => nav({ screen: "customer", id: cust.id })}><span style={{ fontSize: 15, fontWeight: 650, color: "var(--ink)" }}>{cust.name}</span><ChevronRight size={14} /></button>
                  <div className="a-muted" style={{ fontSize: 12 }}>{compact(cust.outstanding)} open · {cust.contacts.length} contacts</div>
                </div>
                <div className="a-chip-row">
                  {[["all", "All channels"], ["email", "Email"], ["whatsapp", "WhatsApp"], ["call", "Calls"], ["portal", "Portal"]].map(([k, l]) => (
                    <Chip key={k} on={chan === k} onClick={() => setChan(k)}>{l}</Chip>
                  ))}
                </div>
              </div>

              {summary && (
                <div className="a-note" style={{ marginBottom: 16, lineHeight: 1.65 }}>
                  <strong style={{ display: "block", marginBottom: 4 }}>Conversation so far</strong>

              <div style={{ display: "grid", gap: 12 }}>

                          </div>
                        )}

                    </div>
                  );
                })}
                {!thread.length && <Empty icon={Mail} title="Nothing on this channel">Switch the channel filter to see the rest.</Empty>}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

const PAY_STATE_KIND = { reconciled: "pos", settled: "warn", matched: "pos", exception: "neg", unapplied: "neg", expected: "mute", scheduled: "mute", overdue: "neg" };

function PaymentActivityScreen() {
  const { state, d, nav } = useApp();
  const [tab, setTab] = useState("all");
  const rows = useMemo(() => {
    const live = state.payments.map((p) => ({
      kind: "payment", id: p.id, customerId: p.customerId, name: p.customerId ? d.custById[p.customerId]?.name : p.payerName,
      amount: p.amount, currency: p.currency, date: p.receivedDate, method: p.method, bank: p.bank, reference: p.reference,
      lifecycle: p.matchState === "matched" && p.erpPosted ? "Reconciled" : p.matchState === "exception" ? "Settled" : p.matchState === "unapplied" ? "Settled" : "Settled",
      match: p.matchState, erp: p.erpPosted ? "Posted" : "Not posted", raw: p,
    }));
    const exp = state.expected.map((e) => ({
      kind: "expected", id: e.id, customerId: e.customerId, name: d.custById[e.customerId]?.name, amount: e.amount, currency: e.currency,
      date: e.expectedDate, method: "—", bank: "—", reference: e.basis, lifecycle: e.state === "overdue" ? "Overdue" : titleCase(e.state), match: "—", erp: "—", raw: e,
    }));
    return sortBy([...exp, ...live], (r) => r.date, -1);

  const filtered = rows.filter((r) => (tab === "all" ? true : tab === "expected" ? r.kind === "expected" : tab === "open" ? r.kind === "payment" && r.match !== "matched" : r.kind === "payment" && r.match === "matched"));

        <Stat label="Awaiting allocation" value={compact(d.portfolio.unappliedCash)} sub={`${state.payments.filter((p) => ["exception", "unapplied"].includes(p.matchState)).length} payments`} kind="neg" />
        <Stat label="Posted to the ERP" value={`${state.payments.filter((p) => p.erpPosted).length}/${state.payments.length}`} sub="Idempotent posting keys" />
      </div>
      <Tabs value={tab} onChange={setTab} tabs={[{ id: "all", label: "All" }, { id: "expected", label: "Expected", count: state.expected.length }, { id: "open", label: "Needs work", count: state.payments.filter((p) => p.matchState !== "matched").length }, { id: "done", label: "Reconciled", count: state.payments.filter((p) => p.matchState === "matched").length }]} />
      <Card pad={false}>
        <DataTable rows={filtered} pageSize={14} onRow={(r) => r.customerId && nav({ screen: "customer", id: r.customerId })}
          columns={[
            { k: "id", h: "Reference", render: (r) => <span className="strong">{r.id}</span> },
            { k: "c", h: "Customer", sort: (r) => r.name || "", render: (r) => r.name || <span className="a-muted">Unidentified payer</span> },
            { k: "a", h: "Amount", num: true, sort: (r) => toUSD(r.amount, r.currency), render: (r) => <span className="strong">{money(r.amount, r.currency)}</span> },
            { k: "m", h: "Method", render: (r) => r.method },
            { k: "d", h: "Date", sort: (r) => r.date, render: (r) => fmtDate(r.date) },

            { k: "mt", h: "Matching", render: (r) => r.match === "—" ? "—" : <Badge kind={PAY_STATE_KIND[r.match]}>{titleCase(r.match)}</Badge> },

        </> : <>
          {sel.installments.some((i) => i.status === "due" || i.status === "scheduled") && <button className="a-btn neg" onClick={() => { const n = sel.installments.find((i) => i.status === "due") || sel.installments.find((i) => i.status === "scheduled"); dispatch({ type: "INSTALLMENT_MISS", planId: sel.id, n: n.n }); setSel(null); }}><AlertTriangle size={14} />Simulate a missed instalment</button>}

                columns={[
                  { k: "n", h: "#", render: (r) => r.n },
                  { k: "d", h: "Due", render: (r) => fmtDate(r.dueDate) },
                  { k: "a", h: "Amount", num: true, render: (r) => money(r.amount) },
                  { k: "s", h: "Status", render: (r) => <Badge kind={r.status === "paid" ? "pos" : r.status === "missed" ? "neg" : r.status === "due" ? "warn" : "mute"}>{titleCase(r.status)}</Badge> },
                  { k: "p", h: "Payment", render: (r) => r.paymentId || "—" },
                ]} />
            </div>
            <div>
              <div className="a-label" style={{ marginBottom: 8 }}>Policy checks at approval</div>
              <div style={{ display: "grid", gap: 7 }}>
                {sel.policyChecks.map((c, i) => (
                  <div key={i} style={{ display: "flex", gap: 10, alignItems: "center", fontSize: 12.8 }}>
                    {c.result === "pass" ? <CheckCircle2 size={14} style={{ color: "var(--pos)" }} /> : <XCircle size={14} style={{ color: "var(--neg)" }} />}
                    <span style={{ flex: 1 }}>{c.rule}</span><span className="a-muted">{c.detail}</span>
                  </div>
                ))}
              </div>
              <div className="a-note" style={{ marginTop: 10 }}>An agent may structure a plan and check it against policy. Approval is always a human decision — no agent authorises a financial concession.</div>
            </div>
            <div>
              <div className="a-label" style={{ marginBottom: 8 }}>Effect on collections</div>
              <div style={{ display: "grid", gap: 8 }}>
                <div className="a-note pos">Invoice dunning on {sel.invoiceIds.join(", ")} is suppressed while the plan is being serviced.</div>
                <div className="a-note">The Payment Plan Servicing campaign sends a WhatsApp reminder three days before each instalment and an email on the due date.</div>
                {sel.status === "missed_installment" && <div className="a-note neg">An instalment has been missed. A collection action has been created and the account's risk, priority and forecast have been recalculated. If the plan defaults, the account returns to its normal campaign.</div>}
              </div>
            </div>
          </div>
        )}
      </Drawer>
    </div>
  );
}

/* --------------------------- CASH APPLICATION ---------------------------- */
function MatchResolver({ payment, onClose }) {
  const { state, dispatch, d, can, nav } = useApp();
  const options = suggestMatchesFor(state, d, payment);
  const [splitGroup, setSplitGroup] = useState(false);
  /* Only invoices belonging to the paying customer can ever be allocated here.
     "Split across entities" widens that to the same corporate group, nothing more. */
  const payerId = payment.customerId || (options[0]?.allocations?.[0] ? d.invById[options[0].allocations[0].invoiceId]?.customerId : null);
  const payer = payerId ? d.custById[payerId] : null;
  const groupIds = payer && payer.group ? d.customers.filter((c) => c.group === payer.group).map((c) => c.id) : payerId ? [payerId] : [];
  const payerInvoices = d.invoices.filter((i) => i.status !== "paid" && (splitGroup ? groupIds.includes(i.customerId) : i.customerId === payerId));
  const [optId, setOptId] = useState(options[0]?.id);
  const opt = options.find((o) => o.id === optId) || options[0];
  const [allocs, setAllocs] = useState(opt ? opt.allocations.map((a) => ({ ...a })) : []);
  const [reason, setReason] = useState("Bank charge");
  useEffect(() => { setAllocs(opt ? opt.allocations.map((a) => ({ ...a })) : []); }, [optId]);

  const cashTotal = sum(allocs.filter((a) => a.type === "cash"), (a) => a.amount);
  const residual = payment.amount - cashTotal;
  const modified = JSON.stringify(allocs) !== JSON.stringify(opt?.allocations || []);
  const tol = state.policies.financial.tolerances.find((t) => t.reason === reason);
  const autoOk = Math.abs(residual) <= (tol?.auto || 0);

  return (
    <Drawer open onClose={onClose} wide title={`Allocate ${money(payment.amount, payment.currency)}`}
      subtitle={`${payment.payerName} · received ${fmtDate(payment.receivedDate)} · ${payment.method} · ${payment.bank}`}
      badges={<><Badge kind="neg" icon={AlertTriangle}>{titleCase(payment.exceptionReason || "review")}</Badge><Badge kind="mute">{payment.reference}</Badge></>}
      footer={<>
        <button className="a-btn pri" disabled={(!can("post_cash") && !can("modify_match")) || !cashTotal} onClick={() => {
          dispatch({
            type: "APPLY_CASH", paymentId: payment.id,
            allocations: [...allocs, ...(Math.abs(residual) > 0.5 ? [{ invoiceId: allocs[0]?.invoiceId, amount: Math.abs(residual), type: reason === "Customer deduction" ? "deduction" : "difference", reason }] : [])],
            confidence: opt?.confidence || 0.9, evidence: opt?.evidence || [], differenceReason: reason,
            correction: modified ? { summary: `Specialist adjusted the agent's ranked allocation for ${payment.payerName}.`, pattern: "Allocation corrected — the agent's ranking will weight this pattern in future." } : (optId !== options[0].id ? { summary: `Specialist chose a lower-ranked option for ${payment.payerName}.`, pattern: "Ranked option overridden — future rankings for this payer will weight the chosen pattern." } : null),
          });
          onClose();
        }}><Check size={14} />Apply and post to the ERP</button>
        {payer?.group && (
          <button className={`a-btn ${splitGroup ? "pos" : ""}`} onClick={() => setSplitGroup((v) => !v)}>
            <Split size={14} />{splitGroup ? `Showing all ${payer.group} entities` : "Split across entities"}
          </button>
        )}
        {(state.payments.find((p) => p.id === payment.id) || payment).matchState !== "unapplied" && <button className="a-btn" onClick={() => { dispatch({ type: "PAYMENT_MARK_UNAPPLIED", paymentId: payment.id }); onClose(); }}><Banknote size={14} />Mark unapplied</button>}
        <button className="a-btn neg" onClick={() => { dispatch({ type: "PAYMENT_ESCALATE", paymentId: payment.id }); onClose(); }}><TrendingUp size={14} />Escalate</button>
      </>}>
      <div style={{ display: "grid", gap: 16 }}>
        <div className="a-note warn">
          Confidence on the highest ranked option is {pct(opt?.confidence || 0)}, below the {pct(state.policies.financial.autoPostMinConfidence)} needed to post automatically. The agent has ranked the possibilities rather than declaring the payment unmatched.
        </div>

        <div>
          <div className="a-label" style={{ marginBottom: 8 }}>Ranked suggestions</div>
          <div style={{ display: "grid", gap: 9 }}>
            {options.map((o, i) => (
              <button key={o.id} className="a-evidence" style={{ textAlign: "left", cursor: "pointer", borderColor: optId === o.id ? "var(--navy-500)" : "var(--line)", boxShadow: optId === o.id ? "0 0 0 3px var(--tint)" : "none" }} onClick={() => setOptId(o.id)}>
                <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                  <Badge kind={i === 0 ? "ai" : "mute"}>Rank {i + 1}</Badge>
                  <span style={{ fontWeight: 600, fontSize: 13, flex: 1 }}>{o.label}</span>
                  <div style={{ width: 150 }}><Confidence value={o.confidence} /></div>
                </div>
                <ul style={{ margin: "8px 0 0", paddingLeft: 18, fontSize: 12.3, color: "var(--ink-2)" }}>
                  {o.evidence.map((e, k) => <li key={k} style={{ marginBottom: 2 }}>{e}</li>)}
                </ul>
                {o.why && <div className="a-note" style={{ marginTop: 8, fontSize: 12.2 }}><strong>Why {pct(o.confidence)}: </strong>{o.why}</div>}
              </button>
            ))}
          </div>
        </div>

        <div>
          <div className="a-label" style={{ marginBottom: 8 }}>Allocation</div>
          <table className="a-table">
            <thead><tr><th>Invoice</th><th>Customer</th><th className="num">Invoice balance</th><th>Type</th><th className="num">Applied</th><th /></tr></thead>
            <tbody>
              {allocs.map((a, i) => {
                const inv = d.invById[a.invoiceId];
                return (
                  <tr key={i}>
                    <td className="strong">{a.invoiceId}</td>
                    <td>{inv ? d.custById[inv.customerId]?.name : "—"}</td>
                    <td className="num">{inv ? money(inv.balance, inv.currency) : "—"}</td>
                    <td>{a.type === "credit_note" ? <Badge kind="mute">Credit note {a.ref}</Badge> : a.type === "difference" ? <Badge kind="warn">{a.reason}</Badge> : a.type === "deduction" ? <Badge kind="neg">Deduction</Badge> : <Badge kind="pos">Cash</Badge>}</td>
                    <td className="num">
                      <input className="a-input" style={{ width: 118, textAlign: "right", padding: "4px 6px" }} type="number" value={a.amount}
                        onChange={(e) => setAllocs(allocs.map((x, j) => (j === i ? { ...x, amount: +e.target.value } : x)))} />
                    </td>
                    <td><button className="a-btn xs ghost" onClick={() => setAllocs(allocs.filter((_, j) => j !== i))}><Trash2 size={12} /></button></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 10, flexWrap: "wrap" }}>
            <select className="a-select" style={{ width: 260 }} value="" onChange={(e) => { if (e.target.value) setAllocs([...allocs, { invoiceId: e.target.value, amount: 0, type: "cash" }]); }}>
              <option value="">Add another invoice from this payer…</option>
              {payerInvoices.filter((i) => !allocs.some((a) => a.invoiceId === i.id)).map((i) => <option key={i.id} value={i.id}>{i.id} — {d.custById[i.customerId]?.name} — {money(i.balance, i.currency)}</option>)}
            </select>
            <div style={{ marginLeft: "auto", display: "flex", gap: 16, alignItems: "center" }}>
              <div><div className="a-label">Cash allocated</div><div style={{ fontWeight: 650 }}>{money(cashTotal, payment.currency)}</div></div>
              <div><div className="a-label">Residual</div><div style={{ fontWeight: 650, color: Math.abs(residual) < 0.5 ? "var(--pos)" : "var(--warn)" }}>{money(residual, payment.currency)}</div></div>
            </div>
          </div>
        </div>

        {Math.abs(residual) > 0.5 && (
          <div>
            <div className="a-label" style={{ marginBottom: 8 }}>Difference handling</div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <select className="a-select" style={{ width: 220 }} value={reason} onChange={(e) => setReason(e.target.value)}>
                {state.policies.financial.tolerances.map((t) => <option key={t.reason}>{t.reason}</option>)}
                <option>Unknown discrepancy</option>
              </select>
              <span className={`a-badge ${autoOk ? "pos" : "warn"}`}>{autoOk ? "Within the auto-clear tolerance" : "Requires review before posting"}</span>
            </div>
            {tol && <div className="a-note" style={{ marginTop: 8 }}>{tol.note}. Auto-clear limit {money(tol.auto)}; review limit {money(tol.review)}. Differences are never written off without authority.</div>}
          </div>
        )}

        {splitGroup && <div className="a-note">Now showing open invoices for every entity in {payer?.group}. Invoices outside this payer's group can never be allocated to this payment.</div>}
        {modified && <div className="a-note pos">Your change will be captured as a learning signal. Corrections influence future ranking; they do not silently become policy.</div>}
      </div>
    </Drawer>
  );
}

function IncomingPaymentsScreen() {

  const [resolve, setResolve] = useState(null);
  const rows = sortBy(state.payments, (p) => p.receivedDate, -1);
  const auto = state.payments.filter((p) => p.autoApplied).length;
  const total = state.payments.length;

  return (
    <div className="a-page">
      <PageHead title="Incoming payments" sub="Every credit that has reached the bank, with the agent's suggested customer, invoices and confidence." />
      <div className="a-grid" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))", marginBottom: 14 }}>
        <Stat label="Payments in this dataset" value={total} sub={compact(sum(state.payments, (p) => toUSD(p.amount, p.currency)))} />
        <Stat label="Applied without a human" value={`${auto} of ${total}`} sub="In this seeded dataset only" kind="pos" />
        <Stat label="Exceptions open" value={state.payments.filter((p) => p.matchState === "exception").length} sub="Ranked options ready for review" kind="neg" />
        <Stat label="Unapplied" value={compact(sum(state.payments.filter((p) => p.matchState === "unapplied"), (p) => toUSD(p.unappliedAmount, p.currency)))} kind="neg" />
      </div>
      <Card pad={false}>
        <DataTable rows={rows} pageSize={14} onRow={(p) => (p.matchState === "matched" ? p.customerId && nav({ screen: "customer", id: p.customerId }) : setResolve(p))}
          columns={[
            { k: "id", h: "Payment", render: (r) => <span className="strong">{r.id}</span> },
            { k: "d", h: "Received", sort: (r) => r.receivedDate, render: (r) => fmtDate(r.receivedDate) },
            { k: "p", h: "Payer", wrap: true, render: (r) => <div><div>{r.payerName}</div>{r.customerId && <div className="a-muted" style={{ fontSize: 11 }}>{d.custById[r.customerId]?.name}</div>}</div> },
            { k: "a", h: "Amount", num: true, sort: (r) => toUSD(r.amount, r.currency), render: (r) => <span className="strong">{money(r.amount, r.currency)}</span> },
            { k: "m", h: "Method", render: (r) => <div><div>{r.method}</div><div className="a-muted" style={{ fontSize: 11 }}>{r.bank}</div></div> },
            { k: "s", h: "Applied to", wrap: true, render: (r) => { const al = state.allocations.filter((a) => a.paymentId === r.id); return al.length ? al.map((a) => a.invoiceId).join(", ") : <span className="a-muted">Awaiting allocation</span>; } },
            { k: "c", h: "Confidence", num: true, sort: (r) => r.confidence, render: (r) => <span style={{ color: r.confidence >= 0.95 ? "var(--pos)" : r.confidence >= 0.7 ? "var(--warn)" : "var(--neg)", fontWeight: 600 }}>{pct(r.confidence)}</span> },
            { k: "st", h: "Matching", render: (r) => <Badge kind={PAY_STATE_KIND[r.matchState]}>{titleCase(r.matchState)}</Badge> },
            { k: "e", h: "ERP", render: (r) => r.erpPosted ? <Pos>Posted</Pos> : <span className="a-muted">Pending</span> },
          ]} />
      </Card>
      {resolve && <MatchResolver payment={resolve} onClose={() => setResolve(null)} />}
    </div>
  );
}
